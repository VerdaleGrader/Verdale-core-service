# Local development: Postgres + Core, no Neon account needed.
#
#   docker compose up --build            # Postgres, migrations, then Core on :8080
#   docker compose run --rm seed         # optional sample users
#
# This does not read .env: the database settings below are for local
# development only. Use `npm run dev` with .env if you want the Neon dev
# branch instead (docs/database.md).

services:
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: verdale_core
      POSTGRES_PASSWORD: local-postgres-password
      POSTGRES_DB: verdale
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdale_core -d verdale"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # One-shot release step: applies pending migrations, then exits.
  migrate:
    build:
      context: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: &database_url postgresql://verdale_core:local-postgres-password@postgres:5432/verdale
      DIRECT_DATABASE_URL: *database_url
    depends_on:
      postgres:
        condition: service_healthy

  core:
    build:
      context: .
    environment:
      ENV: local
      HOST: 0.0.0.0
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *database_url
      DATABASE_POOL_MAX: "10"
    ports:
      - "127.0.0.1:${CORE_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Judge (Verdale-judge-service) reaches Core at host.docker.internal:8080.
    restart: unless-stopped

  # Sample users. Needs dev dependencies (ts-node), so it builds the build stage.
  seed:
    profiles: ["seed"]
    build:
      context: .
      target: build
    command: ["npm", "run", "db:seed"]
    environment:
      DATABASE_URL: *database_url
      DIRECT_DATABASE_URL: *database_url
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
