name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: verdale
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 20
    env:
      # Integration tests (accounts, Spaces, permissions) run against a real database.
      DIRECT_DATABASE_URL: postgresql://postgres:ci@localhost:5432/verdale
      TEST_DATABASE_URL: postgresql://postgres:ci@localhost:5432/verdale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Hidden tests never leave through an endpoint a solver can call (GRD-56)
        run: npx jest src/services/leak
      - run: npm run check

  migrations:
    # Every migration must apply cleanly to an empty database.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: verdale
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 20
    env:
      DIRECT_DATABASE_URL: postgresql://postgres:ci@localhost:5432/verdale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Schema matches the migrations
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npx prisma db seed

  secrets:
    # No secret in the repository, in any commit (GRD-59). Rules and the two narrow
    # exceptions are in .gitleaks.toml; docs/secrets.md says what to do when this fails.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No environment file is tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.example$' || true)
          if [ -n "$tracked" ]; then echo "Tracked environment files: $tracked"; exit 1; fi
      - name: Scan the whole history
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.28.0 detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner -v
