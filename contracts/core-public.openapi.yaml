openapi: 3.0.3
info:
  title: Verdale Core public API
  version: 0.4.0
  description: |
    Public HTTP API of Core service, consumed by the Frontend.
    Endpoints are added story by story: accounts and Spaces (M2), problems, tests,
    reference solutions and submissions (M3). Everything except `/health` and `/ready` lives under `/api/v1`,
    the prefix the web app proxies to Core.

    Every error uses `ErrorResponse`. Every response carries an
    `X-Request-Id` header; when the request sends a UUID in `X-Request-Id`,
    Core reuses it.
servers:
  - url: http://localhost:8080
    description: Local Core
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      operationId: getReady
      summary: Readiness probe (database reachable)
      responses:
        '200':
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: A dependency is down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/auth/providers:
    get:
      operationId: listAuthProviders
      tags: [auth]
      summary: Sign-in methods that are enabled (for the login buttons)
      responses:
        '200':
          description: Enabled providers
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthProvider'
  /api/v1/auth/oauth/{provider}/start:
    get:
      operationId: startOAuth
      tags: [auth]
      summary: Begin sign-in with a provider
      description: |
        Navigate the browser here (not fetch). Core sets a short-lived signed
        cookie and redirects to the provider. Rate limited per client.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: redirect
          in: query
          description: Relative path to open after sign-in. Anything else is replaced by `/`.
          schema:
            type: string
            maxLength: 512
      responses:
        '302':
          description: Redirect to the provider
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/oauth/{provider}/callback:
    get:
      operationId: finishOAuth
      tags: [auth]
      summary: Provider redirect target (browser navigation)
      description: |
        Registered at the provider as `{FRONTEND_ORIGIN}/api/v1/auth/oauth/{provider}/callback`.
        On success sets the `vd_session` cookie (httpOnly, SameSite=Lax, Secure outside local,
        30 days) and redirects to the requested page. On any failure redirects to
        `{FRONTEND_ORIGIN}/login?error=<code>` where code is `access_denied`, `bad_request`
        or `not_found`. Never returns JSON.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the web app
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      description: Deletes the session on the server, so the cookie stops working even if kept.
      responses:
        '204':
          description: Logged out (also when there was no session)
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/me:
    get:
      operationId: getMe
      tags: [users]
      summary: My account
      security:
        - session: []
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateMe
      tags: [users]
      summary: Change display name and/or username
      description: |
        Changing the username also renames the personal Space's slug in the same step.
        Usernames and Space slugs share one namespace.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/users/{username}:
    get:
      operationId: getUser
      tags: [users]
      summary: Public profile (username, display name and picture only)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/me/spaces:
    get:
      operationId: listMySpaces
      tags: [spaces]
      summary: Spaces I belong to, with my role
      description: Personal Space first, then by name. Archived Spaces are listed separately with `archived=true`.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Query'
        - name: archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A page of Spaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpacePage'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/me/invites:
    get:
      operationId: listMyInvites
      tags: [invites]
      summary: Pending invitations addressed to me
      security:
        - session: []
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteList'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/me/invites/{inviteId}/accept:
    post:
      operationId: acceptMyInvite
      tags: [invites]
      summary: Accept an invitation addressed to me
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '200':
          description: Joined the Space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteOutcome'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/me/invites/{inviteId}/decline:
    post:
      operationId: declineMyInvite
      tags: [invites]
      summary: Decline an invitation addressed to me
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteOutcome'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/spaces:
    get:
      operationId: listPublicSpaces
      tags: [spaces]
      summary: Browse and search public, active Spaces
      description: Private Spaces never appear, whoever asks and whatever the query. No login needed.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: A page of Spaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpacePage'
        '400':
          $ref: '#/components/responses/Error'
    post:
      operationId: createSpace
      tags: [spaces]
      summary: Create a Space (the caller becomes its owner)
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpaceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}:
    get:
      operationId: getSpace
      tags: [spaces]
      summary: Read a Space
      description: |
        Public Spaces are readable without logging in. A private Space answers 404 to
        everyone who is not a member, exactly like a Space that does not exist.
        `member_count` is present for members only.
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: The Space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateSpace
      tags: [spaces]
      summary: Edit name, description or visibility (owner or administrator; only the owner can change visibility; the slug never changes)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpaceRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/archive:
    post:
      operationId: archiveSpace
      tags: [spaces]
      summary: Archive a Space (owner only)
      description: |
        Problems stay readable but nothing can be created, edited, published or submitted,
        and settings and members are frozen. A personal Space cannot be archived (409).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: Members of a Space (members only)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Members, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/members/{username}:
    patch:
      operationId: changeMemberRole
      tags: [members]
      summary: Change a member's role (owner or administrator)
      description: |
        The owner can set any role. An administrator can only move editors, observers and
        solvers between those three roles (403 otherwise). Sending `owner` hands the Space
        over (owner only): the previous owner becomes an administrator. The owner cannot be
        demoted directly (409).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Username'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeMember
      tags: [members]
      summary: Remove a member (owner or administrator)
      description: The owner cannot be removed (409); an administrator can only remove editors, observers and solvers.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Username'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/leave:
    post:
      operationId: leaveSpace
      tags: [members]
      summary: Leave a Space
      description: >-
        The owner cannot leave (409); hand the Space over first. Allowed in an archived Space.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '204':
          description: Left
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/invites:
    get:
      operationId: listSpaceInvites
      tags: [invites]
      summary: Pending, unexpired invitations of a Space (owner or administrator)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: createInvite
      tags: [invites]
      summary: Invite by link, or by username (owner or administrator)
      description: |
        Without `username` the result carries a `link` that anyone logged in can use once.
        With `username` only that user can answer it. The `token` is returned once and only
        its hash is stored. Invitations never grant `owner`.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/invites/{inviteId}:
    delete:
      operationId: revokeInvite
      tags: [invites]
      summary: Revoke a pending invitation (owner or administrator)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/InviteId'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/invites/{token}:
    get:
      operationId: previewInvite
      tags: [invites]
      summary: What the holder of an invitation link sees (no login needed)
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: The invitation, with `status` pending, accepted, declined, revoked or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/invites/{token}/accept:
    post:
      operationId: acceptInvite
      tags: [invites]
      summary: Accept an invitation by its link token
      description: |
        410 when it is expired, revoked, already used, or its Space is archived.
        409 when you are already a member (the invitation is not used up).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: Joined the Space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteOutcome'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/invites/{token}/decline:
    post:
      operationId: declineInvite
      tags: [invites]
      summary: Decline an invitation by its link token
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteOutcome'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/tracks:
    get:
      operationId: listTracks
      tags: [tracks]
      summary: Tracks the caller can reach, in order
      description: >-
        Staff (owner, administrator, editor, observer) see every Track; everyone else only active
        Tracks open to the Space or that they joined. A private Space answers 404 to outsiders.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/IncludeArchived'
      responses:
        '200':
          description: The Tracks, with the caller's progression
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrackSummary'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: createTrack
      tags: [tracks]
      summary: Create a Track (owner, administrator or editor)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrackRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/tracks/order:
    put:
      operationId: reorderTracks
      tags: [tracks]
      summary: Set the order of all active Tracks
      description: >-
        Send every active Track exactly once; otherwise 409 `ORDER_OUT_OF_DATE`.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderTracksRequest'
      responses:
        '200':
          description: The Tracks in the new order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/tracks/{trackSlug}:
    get:
      operationId: getTrack
      tags: [tracks]
      summary: A Track with its Collections, problems and the caller's progression
      description: >-
        A Track the caller cannot reach (members-only and not added, or archived) is 404.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/TrackSlug'
      responses:
        '200':
          description: The Track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackDetail'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateTrack
      tags: [tracks]
      summary: Edit a Track, or archive or restore it
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/TrackSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrackRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      operationId: archiveTrack
      tags: [tracks]
      summary: Archive a Track
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/TrackSlug'
      responses:
        '204':
          description: Archived. Problems and Collections are kept.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/tracks/{trackSlug}/collections:
    put:
      operationId: setTrackCollections
      tags: [tracks]
      summary: Set the Collections of a Track and their order
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/TrackSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTrackCollectionsRequest'
      responses:
        '200':
          description: The Track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackDetail'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/tracks/{trackSlug}/progress:
    get:
      operationId: getTrackProgress
      tags: [tracks]
      summary: How far each person has got in a Track (staff only)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/TrackSlug'
      responses:
        '200':
          description: Progression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackProgress'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/tracks/{trackSlug}/members:
    get:
      operationId: listTrackMembers
      tags: [tracks]
