        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/tests/{testId}/output:
    get:
      operationId: downloadTestOutput
      tags: [tests]
      summary: The expected output file of a test (owner or editor)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
        - $ref: '#/components/parameters/TestId'
      responses:
        '200':
          description: The file, as stored
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/solutions:
    get:
      operationId: listReferenceSolutions
      tags: [solutions]
      summary: Reference solutions of the draft (owner or editor)
      description: Never sent to anyone else, in any endpoint.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '200':
          description: Solutions, primary first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReferenceSolution'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: createReferenceSolution
      tags: [solutions]
      summary: Attach a reference solution (owner or editor)
      description: |
        The first solution becomes the primary one. Marking another as primary demotes the
        previous primary. At most `constraints.solutions.max_count` per version.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReferenceSolutionRequest'
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceSolution'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/solutions/{solutionId}:
    patch:
      operationId: updateReferenceSolution
      tags: [solutions]
      summary: Change a reference solution (owner or editor)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
        - $ref: '#/components/parameters/SolutionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReferenceSolutionRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceSolution'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteReferenceSolution
      tags: [solutions]
      summary: Remove a reference solution (owner or editor)
      description: Removing the primary one leaves the version without a primary until another is chosen.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
        - $ref: '#/components/parameters/SolutionId'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/submissions:
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit code
      description: |
        Only for a published problem in a Space the caller can submit to: any logged-in user in a
        public Space, members only in a private one, never in an archived Space. The language must
        be one the problem allows and the source at most `constraints.source_max_bytes` bytes.
        Answers 202 with the submission in status `queued` straight away; follow it with the
        events stream or by polling. If Judge is unavailable the submission is kept and handed
        over later. Limited to 10 submissions per minute per user (429 `RATE_LIMITED`).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionSummary'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
    get:
      operationId: listSubmissions
      tags: [submissions]
      summary: Submissions of a problem, newest first
      description: |
        `scope=mine` (default) lists the caller's own. `scope=all` lists everyone's and is for
        owners and editors only (403 for others).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, all]
            default: mine
      responses:
        '200':
          description: A page of submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/submissions/{submissionId}:
    get:
      operationId: getSubmission
      tags: [submissions]
      summary: One submission with its source and per-test results
      description: |
        Visible to its author, and to owners and editors of the Space (decision log, GRD-46).
        Anyone else gets 404. Results never contain the content of a hidden test; previews
        exist for sample tests only.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: The submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/submissions/{submissionId}/events:
    get:
      operationId: streamSubmission
      tags: [submissions]
      summary: Live status (Server-Sent Events)
      description: |
        `text/event-stream`. The first event, `submission`, is the current state; another follows
        every change; the stream ends after the final one. Each event's data is a `Submission`
        without `source`. A comment line is sent every 15 s to keep proxies open, and
        `retry: 3000` tells the browser to reconnect after 3 s; every connection starts with the
        current state, so a dropped connection loses nothing. Clients without `EventSource`
        can poll `getSubmission` instead.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/submissions/{submissionId}/rejudge:
    post:
      operationId: rejudgeSubmission
      tags: [submissions]
      summary: Check a submission again after a system error
      description: |
        Only when the verdict is `ISE` (never the submitter's fault). The author or an owner
        or editor of the Space can do it. Anything else is 409.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '202':
          description: Queued again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vd_session
      description: |
        Server-side session set by the OAuth callback. State-changing requests that carry it
        must also send `Origin` equal to the web app's origin (CSRF check, 403 otherwise).
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OAuthProvider'
    Slug:
      name: slug
      in: path
      required: true
      description: Space slug (case-insensitive)
      schema:
        type: string
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Query:
      name: q
      in: query
      description: Case-insensitive search in the Space name (public listing also matches the slug)
      schema:
        type: string
        maxLength: 80
    ProblemSlug:
      name: problemSlug
      in: path
      required: true
      description: Problem slug (case-insensitive), unique inside its Space
      schema:
        type: string
    TestId:
      name: testId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SolutionId:
      name: solutionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    OAuthProvider:
      type: string
      enum: [github, google]
    Role:
      type: string
      enum: [owner, editor, solver]
    Me:
      type: object
      description: The account owner's view. Other users never see `id` or `email`.
      required: [id, email, username, display_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        username:
          type: string
          description: 3-32 chars, lower-case letters, digits, `_` or `-`, starting with a letter or digit
        display_name:
          type: string
          maxLength: 64
        created_at:
          type: string
          format: date-time
    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        username:
          type: string
    PublicUser:
      type: object
      required: [username, display_name]
      properties:
        username:
          type: string
        display_name:
          type: string
    Space:
      type: object
      required:
        [id, name, slug, description, visibility, is_personal, archived_at, created_at, my_role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [public, private]
        is_personal:
          type: boolean
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        my_role:
          allOf:
            - $ref: '#/components/schemas/Role'
          nullable: true
          description: null for visitors and non-members
        member_count:
          type: integer
          description: Members only
    SpacePage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Space'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    CreateSpaceRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          description: Same rules as a username; not already used by a Space or a user
        description:
          type: string
          maxLength: 500
          default: ''
        visibility:
          type: string
          enum: [public, private]
          default: private
    UpdateSpaceRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        visibility:
          type: string
          enum: [public, private]
    Member:
      allOf:
        - $ref: '#/components/schemas/PublicUser'
        - type: object
          required: [role, joined_at]
          properties:
            role:
              $ref: '#/components/schemas/Role'
            joined_at:
              type: string
              format: date-time
    CreateInviteRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [editor, solver]
        username:
          type: string
          description: Address the invitation to one user. Omit for a link invitation.
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
    Invite:
      type: object
      required: [id, space, role, status, expires_at, created_at, invited_by, invited_user]
      properties:
        id:
          type: string
          format: uuid
        space:
          type: object
          required: [name, slug]
          properties:
            name:
              type: string
            slug:
              type: string
        role:
          type: string
          enum: [editor, solver]
        status:
          type: string
          enum: [pending, accepted, declined, revoked, expired]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        invited_by:
          $ref: '#/components/schemas/PublicUser'
        invited_user:
          allOf:
            - $ref: '#/components/schemas/PublicUser'
          nullable: true
        token:
          type: string
          description: Only in the response that creates the invitation
        link:
          type: string
          description: Web path that accepts a link invitation, only when created without `username`
    InviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invite'
    InviteOutcome:
      type: object
      required: [space, role, status]
      properties:
        space:
          type: object
          required: [name, slug]
          properties:
            name:
              type: string
            slug:
              type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum: [accepted, declined]
    Language:
      type: string
      description: Same codes as the Judge contract.
      enum: [c, cpp, python]
    ProblemStatus:
      type: string
      description: |
        `draft` was never published; `published` is open to solvers; `archived` was
        published and no longer accepts submissions.
      enum: [draft, published, archived]
    SubmissionStatus:
      type: string
      enum: [queued, running, completed]
    Verdict:
      type: string
      description: |
        Overall verdict. AC accepted, WA wrong answer, TLE time limit exceeded, MLE memory limit
        exceeded, RE runtime error, CE compilation error, OLE output limit exceeded, ISE internal
        system error (never the submitter's fault; can be checked again).
      enum: [AC, WA, TLE, MLE, RE, CE, OLE, ISE]
    TestVerdict:
      type: string
      enum: [AC, WA, TLE, MLE, RE, OLE, ISE, SKIPPED]
    Range:
      type: object
      required: [min, max, default]
      properties:
        min:
          type: integer
        max:
          type: integer
        default:
          type: integer
    TestLimits:
      type: object
      description: What the tests of one problem version may add up to.
      required: [max_count, max_total_bytes, max_file_bytes, max_sample_bytes, max_samples]
      properties:
        max_count:
          type: integer
        max_total_bytes:
          type: integer
          description: Input plus output of every test, after normalising
        max_file_bytes:
          type: integer
          description: Per input or output file, after normalising
        max_sample_bytes:
          type: integer
          description: Per file of a sample test, because samples are shown in the statement
        max_samples:
          type: integer
    ProblemConstraints:
      type: object
      description: The ranges the editor must respect, so the web app never hard-codes them.
      required:
        [
          title_max_length,
          statement_max_length,
          time_limit_ms,
          memory_limit_kb,
          languages,
          tests,
          images,
          solutions,
          source_max_bytes,
        ]
      properties:
        title_max_length:
          type: integer
        statement_max_length:
          type: integer
        time_limit_ms:
          $ref: '#/components/schemas/Range'
        memory_limit_kb:
          $ref: '#/components/schemas/Range'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        tests:
          $ref: '#/components/schemas/TestLimits'
        images:
          type: object
          required: [max_bytes, content_types]
          properties:
            max_bytes:
              type: integer
            content_types:
              type: array
              items:
                type: string
        solutions:
          type: object
          required: [max_count]
          properties:
            max_count:
              type: integer
        source_max_bytes:
          type: integer
          description: Submissions and reference solutions
    CreateProblemRequest:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          description: 2-64 chars, lower-case letters, digits, `_` or `-`, starting with a letter or digit; not `new`, `edit` and similar words
        title:
          type: string
          minLength: 1
          maxLength: 200
        statement:
          type: string
          default: ''
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        allowed_languages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Language'
    UpdateProblemRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        statement:
          type: string
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        allowed_languages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Language'
    SpaceRef:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
    ProblemSummary:
      type: object
      required:
        [
          id,
          slug,
          title,
          status,
          version_number,
          time_limit_ms,
          memory_limit_kb,
          allowed_languages,
          created_by,
          created_at,
          updated_at,
          published_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/ProblemStatus'
        version_number:
          type: integer
          description: The current version
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        allowed_languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        created_by:
          $ref: '#/components/schemas/PublicUser'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          nullable: true
    ProblemPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProblemSummary'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    SampleTest:
      type: object
      required: [position, input, output]
      properties:
        position:
          type: integer
          description: 1-based, in judging order
        input:
          type: string
        output:
          type: string
    Problem:
      type: object
      description: |
        What a solver may know about a problem. Deliberately has no test count, hidden test,
        reference solution or author-only field.
      required:
        [
          id,
          slug,
          status,
          space,
          title,
          statement,
          version_number,
          time_limit_ms,
          memory_limit_kb,
          allowed_languages,
          samples,
          accepts_submissions,
          created_by,
          published_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        status:
          $ref: '#/components/schemas/ProblemStatus'
        space:
          $ref: '#/components/schemas/SpaceRef'
        title:
          type: string
        statement:
          type: string
          description: Markdown with `$...$` and `$$...$$` maths
        version_number:
          type: integer
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        allowed_languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        samples:
          type: array
          items:
            $ref: '#/components/schemas/SampleTest'
        accepts_submissions:
          type: boolean
          description: Published, and its Space is not archived
        created_by:
          $ref: '#/components/schemas/PublicUser'
        published_at:
          type: string
          format: date-time
          nullable: true
    ProblemVersion:
      type: object
      required:
        [
          id,
          number,
          status,
          title,
          statement,
          time_limit_ms,
          memory_limit_kb,
          allowed_languages,
          created_at,
          updated_at,
          published_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        status:
          type: string
          enum: [draft, published]
        title:
          type: string
        statement:
          type: string
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        allowed_languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          nullable: true
    PublishCheck:
      type: object
      required: [key, ok, message]
      properties:
        key:
          type: string
          enum: [statement, languages, sample_test, tests, solution]
        ok:
          type: boolean
        message:
          type: string
          description: What is needed (when not ok) or what is in place (when ok)
    ProblemEditor:
      type: object
      required:
        [
          id,
          slug,
          status,
          space,
          version,
          editable,
          created_by,
          created_at,
          updated_at,
          tests,
          solutions,
          publish_checks,
          can_publish,
          constraints,
        ]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        status:
          $ref: '#/components/schemas/ProblemStatus'
        space:
          $ref: '#/components/schemas/SpaceRef'
        version:
          $ref: '#/components/schemas/ProblemVersion'
        editable:
          type: boolean
          description: The version is a draft, the problem is not archived and the Space is not archived
        created_by:
          $ref: '#/components/schemas/PublicUser'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tests:
          $ref: '#/components/schemas/TestSummary'
        solutions:
          type: object
          required: [count, has_primary]
          properties:
            count:
              type: integer
            has_primary:
              type: boolean
        publish_checks:
          type: array
          items:
            $ref: '#/components/schemas/PublishCheck'
        can_publish:
          type: boolean
          description: Every check is ok and the version is an editable draft
        constraints:
          $ref: '#/components/schemas/ProblemConstraints'
    ImageUpload:
      type: object
      required: [url, markdown, content_type, size_bytes]
      properties:
        url:
          type: string
          description: Absolute path or URL to put in the statement
        markdown:
          type: string
          description: '`![](url)`, ready to insert'
        content_type:
          type: string
        size_bytes:
          type: integer
    TestSummary:
      type: object
      required: [count, sample_count, total_bytes]
      properties:
        count:
          type: integer
        sample_count:
          type: integer
        total_bytes:
          type: integer
    TestCase:
      type: object
      description: |
        Input and expected output are stored as UTF-8 text, normalised on upload: a leading byte order mark is
        removed, CRLF and lone CR become LF, trailing blank lines are removed and a non-empty file ends with
        exactly one LF. Binary files (NUL or other control characters, invalid UTF-8) are refused.
        The SHA-256 and sizes are of the normalised content.
      required:
        [
          id,
          position,
          is_sample,
          input_sha256,
          output_sha256,
          input_size_bytes,
          output_size_bytes,
          created_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          description: 1-based; Judge runs the tests in this order
        is_sample:
          type: boolean
        input_sha256:
          type: string
        output_sha256:
          type: string
        input_size_bytes:
          type: integer
        output_size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
    TestCaseList:
      type: object
      required: [items, summary, limits, editable]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TestCase'
        summary:
          $ref: '#/components/schemas/TestSummary'
        limits:
          $ref: '#/components/schemas/TestLimits'
        editable:
          type: boolean
    ReferenceSolution:
      type: object
      required: [id, language, source, source_bytes, is_primary, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        language:
          $ref: '#/components/schemas/Language'
        source:
          type: string
        source_bytes:
          type: integer
        is_primary:
          type: boolean
        created_by:
          $ref: '#/components/schemas/PublicUser'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateReferenceSolutionRequest:
      type: object
      required: [language, source]
      properties:
        language:
          $ref: '#/components/schemas/Language'
        source:
          type: string
          minLength: 1
        is_primary:
          type: boolean
          description: Defaults to true for the first solution, false after that
    UpdateReferenceSolutionRequest:
      type: object
      minProperties: 1
      properties:
        language:
          $ref: '#/components/schemas/Language'
        source:
          type: string
          minLength: 1
        is_primary:
          type: boolean
    CreateSubmissionRequest:
      type: object
      required: [language, source]
      properties:
        language:
          $ref: '#/components/schemas/Language'
        source:
          type: string
          minLength: 1
          description: UTF-8, at most 65536 bytes
    SubmissionSummary:
      type: object
      required:
        [
          id,
          problem,
          space,
          author,
          language,
          status,
          verdict,
          time_ms,
          memory_kb,
          tests_passed,
          tests_total,
          created_at,
          judged_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        problem:
          type: object
          required: [slug, title]
          properties:
            slug:
              type: string
            title:
              type: string
        space:
          $ref: '#/components/schemas/SpaceRef'
        author:
          $ref: '#/components/schemas/PublicUser'
        language:
          $ref: '#/components/schemas/Language'
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        verdict:
          allOf:
            - $ref: '#/components/schemas/Verdict'
          nullable: true
          description: Set once `status` is `completed`
        time_ms:
          type: integer
          nullable: true
          description: Slowest test that ran
        memory_kb:
          type: integer
          nullable: true
          description: Largest peak memory of a test that ran
        tests_passed:
          type: integer
          nullable: true
        tests_total:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        judged_at:
          type: string
          format: date-time
          nullable: true
    SubmissionPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionSummary'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    SubmissionTestResult:
      type: object
      description: |
        One test, in judging order. Hidden tests carry the verdict, time and memory and nothing
        else; the previews exist for sample tests only.
      required: [position, is_sample, verdict, time_ms, memory_kb]
      properties:
        position:
          type: integer
        is_sample:
          type: boolean
        verdict:
          $ref: '#/components/schemas/TestVerdict'
        time_ms:
          type: integer
        memory_kb:
          type: integer
        stdout_preview:
          type: string
          maxLength: 1024
        checker_message:
          type: string
          maxLength: 256
    Submission:
      allOf:
        - $ref: '#/components/schemas/SubmissionSummary'
        - type: object
          required: [compile_message, error_code, results, can_rejudge]
          properties:
            source:
              type: string
              description: Missing in the events stream
            compile_message:
              type: string
              nullable: true
              description: Compiler output (at most 8192 characters) when the verdict is CE
            error_code:
              type: string
              nullable: true
              description: Why the verdict is ISE, e.g. `SANDBOX_FAILURE` or `JUDGE_UNAVAILABLE`
            results:
              type: array
              items:
                $ref: '#/components/schemas/SubmissionTestResult'
            can_rejudge:
              type: boolean
              description: The verdict is ISE and the caller may ask for another check
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: boolean
    ErrorResponse:
      type: object
      description: The one error shape used by every Verdale service.
      required: [status, error_code, message, request_id]
      properties:
        status:
          type: integer
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
