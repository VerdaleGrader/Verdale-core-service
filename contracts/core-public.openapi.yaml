        user:
          $ref: '#/components/schemas/PublicUser'
        progress:
          $ref: '#/components/schemas/Progress'
        collections:
          type: array
          items:
            type: object
            required: [id, slug, name, progress, problems]
            properties:
              id:
                type: string
                format: uuid
              slug:
                type: string
              name:
                type: string
              progress:
                $ref: '#/components/schemas/Progress'
              problems:
                type: array
                items:
                  type: object
                  required: [id, slug, title, solved]
                  properties:
                    id:
                      type: string
                      format: uuid
                    slug:
                      type: string
                    title:
                      type: string
                    solved:
                      type: boolean
    MemberProgress:
      type: object
      required: [user, role, progress, collections]
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        role:
          $ref: '#/components/schemas/Role'
        progress:
          $ref: '#/components/schemas/Progress'
        collections:
          type: array
          items:
            type: object
            required: [id, slug, name, progress]
            properties:
              id:
                type: string
                format: uuid
              slug:
                type: string
              name:
                type: string
              progress:
                $ref: '#/components/schemas/Progress'
    MemberProgressList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberProgress'
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: boolean
    ErrorResponse:
      type: object
      description: The one error shape used by every Verdale service.
      required: [status, error_code, message, request_id]
      properties:
        status:
          type: integer
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    SubmissionTestDetail:
      type: object
      required:
        [
          submission_id,
          position,
          verdict,
          is_sample,
          time_ms,
          memory_kb,
          exit_code,
          signal,
          input,
          expected,
          output,
          stderr,
        ]
      properties:
        submission_id:
          type: string
          format: uuid
        position:
          type: integer
        verdict:
          $ref: '#/components/schemas/TestVerdict'
        is_sample:
          type: boolean
        time_ms:
          type: integer
        memory_kb:
          type: integer
        exit_code:
          type: integer
          nullable: true
        signal:
          type: integer
          nullable: true
        input:
          allOf:
            - $ref: '#/components/schemas/SubmissionFilePart'
          nullable: true
          description: Null when `part` asked for another part
        expected:
          allOf:
            - $ref: '#/components/schemas/SubmissionFilePart'
          nullable: true
          description: Null when `part` asked for another part. A test without an expected output is `unavailable`
        output:
          allOf:
            - $ref: '#/components/schemas/SubmissionFilePart'
          nullable: true
          description: What the program printed; null when `part` asked for another part or Judge sent none
        stderr:
          allOf:
            - $ref: '#/components/schemas/SubmissionFilePart'
          nullable: true
          description: Null when `part` asked for another part or Judge sent none
    SubmissionFilePart:
      allOf:
        - $ref: '#/components/schemas/TextSlice'
        - type: object
          required: [cut]
          properties:
            cut:
              type: boolean
              description: What was kept of the program's output is shorter than what it printed
            unavailable:
              type: boolean
              description: The file could not be read (never stored, or removed); `lines` is empty
    TextSlice:
      type: object
      description: A window of lines of a text, with the totals needed to say "showing 10 of 4,203 lines".
      required: [lines, from_line, to_line, total_lines, size_bytes, line_truncated]
      properties:
        lines:
          type: array
          description: The lines of the window without their line breaks (CR before LF dropped)
          items:
            type: string
        from_line:
          type: integer
          description: 1-based number of the first line in `lines`; `total_lines + 1` when past the end
        to_line:
          type: integer
          description: 1-based number of the last line in `lines`; `from_line - 1` when the window is empty
        total_lines:
          type: integer
          description: Lines in the whole text; a last line without a line break counts
        size_bytes:
          type: integer
        line_truncated:
          type: boolean
          description: A line of the window was longer than 10000 characters and was cut
    SaveTestCasesRequest:
      type: object
      required: [tests]
      properties:
        revision:
          type: string
          maxLength: 64
          description: The `revision` of the list the changes started from
        tests:
          type: array
          maxItems: 500
          description: The testcases the problem should have afterwards, in order; those not listed are removed
          items:
            $ref: '#/components/schemas/SaveTestCaseItem'
    SaveTestCaseItem:
      type: object
      required: [is_sample]
      properties:
        id:
          type: string
          format: uuid
          description: An existing testcase of this problem; left out for a new one
        is_sample:
          type: boolean
        input:
          $ref: '#/components/schemas/TestFileRef'
        output:
          $ref: '#/components/schemas/TestFileRef'
    TestFileRef:
      type: object
      required: [sha256]
      properties:
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    StagedFile:
      type: object
      required: [sha256, size_bytes, total_lines]
      properties:
        sha256:
          type: string
          description: Of the normalised content; what `saveTestCases` refers to
        size_bytes:
          type: integer
        total_lines:
          type: integer
    SpaceSubmissionPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SpaceSubmissionRow'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    SpaceSubmissionRow:
      type: object
      required:
        [
          id,
          created_at,
          member,
          problem,
          track,
          version,
          language,
          status,
          verdict,
          tests_passed,
          tests_total,
          time_ms,
          memory_kb,
        ]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        member:
          $ref: '#/components/schemas/PublicUser'
        problem:
          type: object
          required: [slug, title]
          properties:
            slug:
              type: string
            title:
              type: string
              description: Title of the version that was judged
        track:
          allOf:
            - $ref: '#/components/schemas/TrackRef'
          nullable: true
          description: The Track the submission was made from; null when none reached the problem
        version:
          type: integer
          description: Number of the problem version that was judged
        language:
          $ref: '#/components/schemas/Language'
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        verdict:
          allOf:
            - $ref: '#/components/schemas/Verdict'
          nullable: true
        tests_passed:
          type: integer
          nullable: true
        tests_total:
          type: integer
          nullable: true
        time_ms:
          type: integer
          nullable: true
        memory_kb:
          type: integer
          nullable: true
    TrackRef:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
    TrackSubmissionProblems:
      type: object
      required: [track, collections, items]
      properties:
        track:
          type: object
          required:
            [
              name,
              slug,
              visibility,
              collections,
              problems,
              members,
              submissions,
              accepted,
              finished,
            ]
          properties:
            name:
              type: string
            slug:
              type: string
            visibility:
              $ref: '#/components/schemas/TrackVisibility'
            collections:
              type: integer
            problems:
              type: integer
            members:
              type: integer
            submissions:
              type: integer
            accepted:
              type: integer
            finished:
              type: integer
              description: Solvers who can see the Track and solved every published problem of it
        collections:
          type: array
          description: Active Collections of the Track, for the collection filter
          items:
            $ref: '#/components/schemas/TrackRef'
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackProblemRollup'
    TrackProblemRollup:
      type: object
      required:
        [problem, collections, tried, solved, submissions, most_common_failure, last_submission_at]
      properties:
        problem:
          $ref: '#/components/schemas/SubmissionProblemRef'
        collections:
          type: array
          description: The Collections of the Track that hold the problem
          items:
            $ref: '#/components/schemas/TrackRef'
        tried:
          type: integer
          description: People who submitted
        solved:
          type: integer
          description: People who solved it
        submissions:
          type: integer
        most_common_failure:
          allOf:
            - $ref: '#/components/schemas/FailureMode'
          nullable: true
        last_submission_at:
          type: string
          format: date-time
          nullable: true
    FailureMode:
      type: object
      required: [verdict, test_position, count]
      properties:
        verdict:
          $ref: '#/components/schemas/Verdict'
        test_position:
          type: integer
          nullable: true
          description: The first test that failed (1-based); null for a compilation error
        count:
          type: integer
    SubmissionProblemRef:
      type: object
      required: [slug, title, status]
      properties:
        slug:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/ProblemStatus'
    StartGenerateRequest:
      type: object
      required: [solution_id]
      properties:
        solution_id:
          type: string
          format: uuid
          description: A reference solution of this problem
        test_ids:
          type: array
          minItems: 1
          maxItems: 500
          description: Testcases to run, each once; the others keep what they have. All of them when left out
          items:
            type: string
            format: uuid
    ProblemRollupPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProblemRollup'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    ProblemRollup:
      type: object
      required: [problem, tracks, tried, solved, submissions, last_verdict, last_submission_at]
      properties:
        problem:
          $ref: '#/components/schemas/SubmissionProblemRef'
        tracks:
          type: array
          description: Active Tracks that reach the problem, in Track order
          items:
            $ref: '#/components/schemas/TrackRef'
        tried:
          type: integer
        solved:
          type: integer
        submissions:
          type: integer
        last_verdict:
          allOf:
            - $ref: '#/components/schemas/Verdict'
          nullable: true
        last_submission_at:
          type: string
          format: date-time
          nullable: true
    StageTextRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 1048576
          description: At most 1 MiB and no NUL character
    TrackRollup:
      type: object
      required:
        [track, problems, members, submissions, accepted, members_finished, last_submission_at]
      properties:
        track:
          type: object
          required: [name, slug, visibility, is_default]
          properties:
            name:
              type: string
            slug:
              type: string
            visibility:
              $ref: '#/components/schemas/TrackVisibility'
            is_default:
              type: boolean
        problems:
          type: integer
          description: Published problems in the Track
        members:
          type: integer
          description: Solvers who can see the Track
        submissions:
          type: integer
        accepted:
          type: integer
        members_finished:
          type: integer
          description: Solvers who can see the Track and solved every published problem of it
        last_submission_at:
          type: string
          format: date-time
          nullable: true
    AiProvider:
      type: string
      enum: [gemini, claude]
    AiCredential:
      type: object
      required: [provider, last4]
      properties:
        provider:
          $ref: '#/components/schemas/AiProvider'
        last4:
          type: string
          description: The last four characters of the key, the only part ever shown
    AiCredentialList:
      type: object
      required: [enabled, items]
      properties:
        enabled:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/AiCredential'
    SaveAiCredentialRequest:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string
          description: The provider's API key, 8 to 512 characters with no spaces
    StartAiTestsRequest:
      type: object
      required: [provider, count, solution_id]
      properties:
        provider:
          $ref: '#/components/schemas/AiProvider'
        count:
          type: integer
          minimum: 1
          maximum: 20
        categories:
          type: array
          description: Optional. Left empty, the model follows the statement.
          items:
            type: string
            enum: [edge, max, random]
        solution_id:
          type: string
          format: uuid
          description: The reference solution that produces the expected outputs
        include_solution:
          type: boolean
          default: false
          description: Also send the solution's code to the provider. Off unless the author turns it on.
    AiTestFile:
      type: object
      required: [sha256, size_bytes]
      properties:
        sha256:
          type: string
        size_bytes:
          type: integer
    AiTestItem:
      type: object
      required: [id, position, status, input, input_text, output, output_preview, skip_reason]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
        status:
          type: string
          enum: [pending, ok, skipped]
        input:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AiTestFile'
        input_text:
          type: string
          nullable: true
          description: The generated input; only once the job is `completed`
        output:
          nullable: true
          description: The expected output Judge produced, ready to go into `saveTestCases`
          allOf:
            - $ref: '#/components/schemas/AiTestFile'
        output_preview:
          type: string
          nullable: true
          description: The first characters of the expected output; only once the job is `completed`
        skip_reason:
          type: string
          nullable: true
          description: Why the item cannot be used (a format problem, or what happened when the solution ran on it)
    AiTestJob:
      type: object
      required:
        [
          id,
          status,
          provider,
          requested_count,
          error,
          created_at,
          deadline_at,
          finished_at,
          usable_count,
          skipped_count,
          items,
        ]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [generating, computing, completed, failed]
        provider:
          $ref: '#/components/schemas/AiProvider'
        requested_count:
          type: integer
        error:
          type: object
          nullable: true
          description: |
            Set when the job failed as a whole: `AI_KEY_INVALID`, `AI_QUOTA_EXCEEDED`,
            `AI_BAD_RESPONSE`, `AI_UNAVAILABLE`, `COMPILE_ERROR`, `JUDGE_UNAVAILABLE`,
            `JUDGE_REJECTED`, `JUDGE_ERROR`, `TIMED_OUT` or `INTERNAL_ERROR`
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        created_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        usable_count:
          type: integer
        skipped_count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/AiTestItem'
    GenerateJob:
      type: object
      required: [id, status, error, created_at, deadline_at, finished_at, progress, runs]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, completed, stopped, timed_out, failed]
        error:
          type: object
          nullable: true
          description: Set when the job failed as a whole, e.g. `COMPILE_ERROR` when the solution does not compile
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        created_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        progress:
          type: object
          required: [total, done, failed]
          properties:
            total:
              type: integer
            done:
              type: integer
            failed:
              type: integer
        runs:
          type: array
          description: In testcase order
          items:
            $ref: '#/components/schemas/GenerateRun'
    GenerateRun:
      type: object
      required:
        [
          test_id,
          position,
          status,
          verdict,
          error_code,
          time_ms,
          memory_kb,
          stderr,
          output,
          same_as_current,
        ]
      properties:
        test_id:
          type: string
          format: uuid
        position:
          type: integer
        status:
          type: string
          enum: [queued, running, done, failed]
        verdict:
          type: string
          nullable: true
          description: Why a run failed, one of TLE, MLE, RE, OLE, ISE
        error_code:
          type: string
          nullable: true
          description: e.g. `COMPILE_ERROR`, `NO_OUTPUT` or `JUDGE_UNAVAILABLE`
        time_ms:
          type: integer
          nullable: true
        memory_kb:
          type: integer
          nullable: true
        stderr:
          type: string
          nullable: true
          description: The start of the standard error (at most 1000 characters)
        output:
          type: object
          nullable: true
          description: The generated expected output, ready to be put in `saveTestCases`
          required: [sha256, size_bytes]
          properties:
            sha256:
              type: string
            size_bytes:
              type: integer
        same_as_current:
          type: boolean
          nullable: true
          description: |
            The output equals the testcase's current expected output as Judge compares (trailing
            spaces and trailing blank lines do not count); null when there is nothing to compare
    TestFileSlice:
      allOf:
        - $ref: '#/components/schemas/TextSlice'
        - type: object
          required: [position, side]
          properties:
            position:
              type: integer
              description: Position of the testcase
            side:
              type: string
              enum: [input, output]
    MemberProblemPage:
      type: object
      required: [items, page, page_size, total, member]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberProblem'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        member:
          $ref: '#/components/schemas/MemberRollup'
    MemberProblem:
      type: object
      required: [problem, track, attempts, solved, best_verdict, last_verdict, last_submission_at]
      properties:
        problem:
          $ref: '#/components/schemas/SubmissionProblemRef'
        track:
          allOf:
            - $ref: '#/components/schemas/TrackRef'
          nullable: true
          description: The Track of the person's latest submission of the problem
        attempts:
          type: integer
        solved:
          type: boolean
        best_verdict:
          allOf:
            - $ref: '#/components/schemas/Verdict'
          nullable: true
        last_verdict:
          allOf:
            - $ref: '#/components/schemas/Verdict'
          nullable: true
        last_submission_at:
          type: string
          format: date-time
          nullable: true
    MemberRollup:
      type: object
      required:
        [user, role, attempted, solved, submissions, ac_rate, last_verdict, last_submission_at]
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          nullable: true
          description: Null for someone who submitted without being a member
        attempted:
          type: integer
          description: Problems tried
        solved:
          type: integer
        submissions:
          type: integer
        ac_rate:
          type: number
          nullable: true
          description: Accepted submissions out of all of them, 0 to 1; null when there are none
        last_verdict:
          allOf:
            - $ref: '#/components/schemas/Verdict'
          nullable: true
        last_submission_at:
          type: string
          format: date-time
          nullable: true
    MemberRollupPage:
      type: object
      required: [items, page, page_size, total, totals]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberRollup'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        totals:
          type: object
          description: Over every row that matches the filters, not only this page
          required: [members, submissions]
          properties:
            members:
              type: integer
            submissions:
              type: integer
