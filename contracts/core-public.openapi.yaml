  /api/v1/spaces/{slug}/problems/{problemSlug}/tests:
    get:
      operationId: listTestCases
      tags: [tests]
      summary: Tests of the draft, with totals and limits (owner or editor)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '200':
          description: Tests in judging order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: createTestCase
      tags: [tests]
      summary: Add a test at the end (owner or editor)
      description: |
        `multipart/form-data` with parts `input` and `output` (files) and optional `is_sample`
        (`true` or `false`). Both files are checked and normalised (see `TestCase`); the first
        problem found is reported in `details` with the field `input` or `output`, naming the
        file and the reason. Identical content is stored once. Only the draft can change.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [input, output]
              properties:
                input:
                  type: string
                  format: binary
                output:
