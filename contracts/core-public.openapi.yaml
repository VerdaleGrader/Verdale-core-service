  /api/v1/spaces/{slug}/problems/{problemSlug}/publish:
    post:
      operationId: publishProblem
      tags: [problems]
      summary: Publish the draft (owner or editor)
      description: |
        Makes the draft the published, immutable version. Needs a statement, at least
        one sample test, one test in total with an expected output for every test, one allowed
        language and a primary reference solution; otherwise 409 `PUBLISH_BLOCKED` with one `details` entry per missing item.
        Provisional: Milestone 4 puts the verification run (reference solution against
        every test on Judge) in front of this step.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/archive:
    post:
      operationId: archiveProblem
      tags: [problems]
      summary: Archive a published problem (owner or editor)
      description: It stays readable but no longer accepts submissions. A never-published draft is deleted instead (409).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '200':
