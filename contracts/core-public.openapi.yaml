  /api/v1/spaces/{slug}/problems/{problemSlug}/generate:
    post:
      operationId: startGenerate
      tags: [tests]
      summary: Create expected outputs by running a reference solution (owner or editor)
      description: |
        Runs the saved solution on the inputs of the chosen testcases (all of them when
        `test_ids` is left out), one Judge job per testcase, at most three at a time. Nothing in
        the problem changes: each finished run offers its `output` as a hash that goes into
        `saveTestCases` when the author accepts it. Answers 202 with the job; follow it with
        `getGenerate`. One job at a time per problem (409 `GENERATE_RUNNING`); the job gives up
        after 10 minutes. A solution or testcase that is not of this problem is 404 / 400.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartGenerateRequest'
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateJob'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
