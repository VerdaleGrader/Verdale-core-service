              type: integer
            pages:
              type: integer
        version_number:
          type: integer
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        allowed_languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        samples:
          type: array
          items:
            $ref: '#/components/schemas/SampleTest'
        accepts_submissions:
          type: boolean
          description: Published, and its Space is not archived
        created_by:
          $ref: '#/components/schemas/PublicUser'
        published_at:
          type: string
          format: date-time
          nullable: true
    StatementMode:
      type: string
      enum: [markdown, pdf]
      description: What solvers read as the statement, a Markdown text or an uploaded PDF.
    ProblemVersion:
      type: object
      required:
        [
          id,
          number,
          status,
          title,
          statement,
          statement_mode,
          statement_pdf,
          time_limit_ms,
          memory_limit_kb,
          allowed_languages,
          created_at,
          updated_at,
          published_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        status:
          type: string
          enum: [draft, published]
        title:
          type: string
        statement:
          type: string
        statement_mode:
          $ref: '#/components/schemas/StatementMode'
        statement_pdf:
          type: object
          nullable: true
          description: The uploaded PDF. Kept on the draft even while the mode is `markdown`.
          required: [size_bytes, pages, sha256]
          properties:
            size_bytes:
              type: integer
            pages:
              type: integer
            sha256:
              type: string
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        allowed_languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          nullable: true
    PublishCheck:
      type: object
      required: [key, ok, message]
      properties:
        key:
          type: string
          enum: [statement, languages, sample_test, tests, outputs, solution]
        ok:
          type: boolean
        message:
          type: string
          description: |
            What is needed (when not ok) or what is in place (when ok). `outputs` is not ok while a
            testcase has no expected output: upload one or generate it from a solution
    ProblemEditor:
      type: object
      required:
        [
          id,
          slug,
          status,
          space,
          version,
          editable,
          created_by,
          created_at,
          updated_at,
          tests,
          solutions,
          publish_checks,
          can_publish,
          constraints,
        ]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        status:
          $ref: '#/components/schemas/ProblemStatus'
        space:
          $ref: '#/components/schemas/SpaceRef'
        version:
          $ref: '#/components/schemas/ProblemVersion'
        editable:
          type: boolean
          description: The version is a draft, the problem is not archived and the Space is not archived
        created_by:
          $ref: '#/components/schemas/PublicUser'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tests:
          $ref: '#/components/schemas/TestSummary'
        solutions:
          type: object
          required: [count, has_primary]
          properties:
            count:
              type: integer
            has_primary:
              type: boolean
        publish_checks:
          type: array
          items:
            $ref: '#/components/schemas/PublishCheck'
        can_publish:
          type: boolean
          description: Every check is ok and the version is an editable draft
        constraints:
          $ref: '#/components/schemas/ProblemConstraints'
    ImageUpload:
      type: object
      required: [url, markdown, content_type, size_bytes]
      properties:
        url:
          type: string
          description: Absolute path or URL to put in the statement
        markdown:
          type: string
          description: '`![](url)`, ready to insert'
        content_type:
          type: string
        size_bytes:
          type: integer
    TestSummary:
      type: object
      required: [count, sample_count, missing_output_count, total_bytes]
      properties:
        count:
          type: integer
        sample_count:
          type: integer
        missing_output_count:
          type: integer
          description: Testcases still waiting for an expected output
        total_bytes:
          type: integer
    TestCase:
      type: object
      description: |
        Input and expected output are stored as UTF-8 text, normalised on upload: a leading byte order mark is
        removed, CRLF and lone CR become LF, trailing blank lines are removed and a non-empty file ends with
        exactly one LF. Binary files (NUL or other control characters, invalid UTF-8) are refused.
        The SHA-256 and sizes are of the normalised content. A testcase created on the testcases page
        can have no expected output yet (`output_sha256` and `output_size_bytes` null).
      required:
        [
          id,
          position,
          is_sample,
          input_sha256,
          output_sha256,
          input_size_bytes,
          output_size_bytes,
          created_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          description: 1-based; Judge runs the tests in this order
        is_sample:
          type: boolean
        input_sha256:
          type: string
        output_sha256:
          type: string
          nullable: true
          description: Null while the expected output is still to be uploaded or generated
        input_size_bytes:
          type: integer
        output_size_bytes:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
    TestCaseList:
      type: object
      required: [items, summary, limits, editable, revision]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TestCase'
        summary:
          $ref: '#/components/schemas/TestSummary'
        limits:
          $ref: '#/components/schemas/TestLimits'
        editable:
          type: boolean
        revision:
          type: string
          description: |
            Changes whenever the order, files or visibility of the testcases do. Send it with
            `saveTestCases`; if the testcases changed meanwhile the save is 409 `TESTS_CHANGED`
    ReferenceSolution:
