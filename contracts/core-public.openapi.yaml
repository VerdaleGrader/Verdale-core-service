                  format: binary
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUpload'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/statement/pdf:
    put:
      operationId: uploadStatementPdf
      tags: [problems]
      summary: Upload the PDF statement and switch to PDF mode (owner or editor)
      description: |
        `multipart/form-data` with one `file` part. The file must start with `%PDF-` (the name and declared type are not
        trusted), be at most `constraints.pdf.max_bytes`, have at most `constraints.pdf.max_pages` pages, and not be encrypted.
        The 400 `details` entry for `file` names the file and the reason. Stored in the private bucket under its SHA-256.
        Only the draft version can change (409 `VERSION_PUBLISHED`).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: The editor view with the new statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      operationId: getStatementPdf
      tags: [problems]
      summary: The PDF statement
      description: |
        Same permission as reading the problem: 404 for a draft (unless owner or editor), for a problem outside every Track
        the caller can see, and for a private Space. `draft=true` returns the draft's file to owners and editors.
        Served as `application/pdf` with `nosniff`, `Content-Security-Policy: default-src 'none'; sandbox` and
        `Cache-Control: private`, so nothing inside it can run in our pages.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
        - name: draft
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
