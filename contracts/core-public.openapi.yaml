  /api/v1/spaces/{slug}/problems:
    get:
      operationId: listProblems
      tags: [problems]
      summary: Problems of a Space
      description: |
        Visitors and solvers only ever see `published` problems that sit in a Collection of a Track
        they can reach (see Tracks), whatever `status` says. A problem outside every such Track
        answers 404 to them everywhere (detail, submit), as a private Space would.
        Owners, administrators, editors and observers can also list `draft` and `archived` problems, or `all`
        (default `published`); `mine=true` keeps the ones they created.
        A private Space answers 404 to everyone who is not a member.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Case-insensitive search in the title and the slug
          schema:
            type: string
            maxLength: 80
        - name: status
          in: query
          description: Owners and editors only; ignored for everyone else
          schema:
            type: string
            enum: [published, draft, archived, all]
            default: published
        - name: mine
          in: query
          description: Owners and editors only; only problems I created
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A page of problems, newest change first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemPage'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: createProblem
      tags: [problems]
      summary: Start a draft problem (owner or editor)
      description: |
        Creates the problem with an empty draft (version 1). Fill it with `PATCH`.
        Not allowed in an archived Space.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProblemRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}:
    get:
      operationId: getProblem
      tags: [problems]
      summary: A problem as the solver sees it
      description: |
        The statement, limits, allowed languages and the sample tests, nothing else:
        hidden tests, reference solutions and internal data are never sent here.
        A draft problem answers 404 unless the caller is an owner or editor of the Space,
        who then sees exactly what solvers will see (a preview). Archived problems stay
        readable but report `accepts_submissions: false`.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '200':
          description: The problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateProblem
      tags: [problems]
      summary: Edit the draft (owner or editor)
      description: |
        Changes title, statement, limits or allowed languages of the draft version.
        A published version never changes: 409 `VERSION_PUBLISHED`.
        Limits outside the ranges in `constraints` are refused with a `details` entry per field.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProblemRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteProblem
      tags: [problems]
      summary: Delete a draft problem (owner or editor)
      description: A problem that has been published cannot be deleted; archive it instead (409).
      security:
        - session: []
      parameters:
