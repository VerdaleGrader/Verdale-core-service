        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUpload'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/statement/pdf:
    put:
      operationId: uploadStatementPdf
      tags: [problems]
      summary: Upload the PDF statement and switch to PDF mode (owner, administrator or editor)
      description: |
        `multipart/form-data` with one `file` part. The file must start with `%PDF-` (the name and declared type are not
        trusted), be at most `constraints.pdf.max_bytes`, have at most `constraints.pdf.max_pages` pages, and not be encrypted.
        The 400 `details` entry for `file` names the file and the reason. Stored in the private bucket under its SHA-256.
        Only the draft version can change (409 `VERSION_PUBLISHED`).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: The editor view with the new statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      operationId: getStatementPdf
      tags: [problems]
      summary: The PDF statement
      description: |
        Same permission as reading the problem: 404 for a draft (unless staff), for a problem outside every Track
        the caller can see, and for a private Space. `draft=true` returns the draft's file to the staff.
        Served as `application/pdf` with `nosniff`, `Content-Security-Policy: default-src 'none'; sandbox` and
        `Cache-Control: private`, so nothing inside it can run in our pages.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
        - name: draft
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/assets/{name}:
    get:
      operationId: getAsset
      tags: [problems]
      summary: A statement picture
      description: |
        Served by Core only when the public bucket has no public URL of its own
        (`PUBLIC_ASSET_BASE_URL`), as in local development. Immutable and cacheable.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/tests:
    get:
      operationId: listTestCases
      tags: [tests]
      summary: Tests of the draft, with totals and limits (owner, administrator, editor, observer)
      description: |
        A testcase can wait for its expected output: `output_sha256` and `output_size_bytes` are
        then null and `summary.missing_output_count` counts it (publishing is blocked until none
        is left, see `PublishCheck`). `revision` identifies the current order, files and
        visibility; send it back to `saveTestCases` so two people editing at once cannot
        overwrite each other.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '200':
          description: Tests in judging order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: createTestCase
      tags: [tests]
      summary: Add a test at the end (owner, administrator or editor)
      description: |
        `multipart/form-data` with parts `input` and `output` (files) and optional `is_sample`
        (`true` or `false`). Both files are checked and normalised (see `TestCase`); the first
        problem found is reported in `details` with the field `input` or `output`, naming the
        file and the reason. Identical content is stored once. Only the draft can change.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [input, output]
              properties:
                input:
                  type: string
                  format: binary
                output:
                  type: string
                  format: binary
                is_sample:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCase'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    put:
      operationId: saveTestCases
      tags: [tests]
      summary: Save every change of the testcases page at once (owner, administrator or editor)
      description: |
        `tests` is the list the problem should have afterwards, in order; a testcase that is
        not listed is removed. An entry with `id` keeps that testcase; without `id` it is new
        and needs an `input`. `input` and `output` refer to files by hash, uploaded earlier with
        `stageTestFile` or created by Generate; a left-out file stays as it is (a new testcase
        without `output` has none yet). Either everything is saved or nothing.
        `revision` is the one `listTestCases` returned; when the testcases have changed since,
        409 `TESTS_CHANGED` and nothing is saved. Without it the check is skipped.
        Other 409 codes: `SAMPLE_LIMIT_REACHED`, `SAMPLE_TOO_LARGE`, `TEST_LIMIT_REACHED`,
        `TEST_SIZE_LIMIT_REACHED`, `VERSION_PUBLISHED`, `PROBLEM_ARCHIVED`. An id that is not a
        testcase of this problem, a duplicate id or a file that was never uploaded is 400 with
        one `details` entry per problem (field `tests[0].input` and the like).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTestCasesRequest'
      responses:
        '200':
          description: The saved testcases, with the new revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/tests/files:
    post:
      operationId: stageTestFile
      tags: [tests]
      summary: Check and store one file for a later save (owner, administrator or editor)
      description: |
        Either `multipart/form-data` with the part `file`, or JSON `{ "text": "..." }` for pasted
        text. The file is checked and normalised as described in `TestCase` and stored by its
        SHA-256; the problem does not change until `saveTestCases` refers to the hash. Identical
        content is stored once and a file nobody uses is simply left unreferenced. A file that is
        binary, has a NUL, or is over 8 MiB is 400 with `details` field `file` naming the file.
        Pasted text over 1 MiB is 413. Only while the draft is open (409 otherwise). Limited to
        300 requests per minute.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
          application/json:
            schema:
              $ref: '#/components/schemas/StageTextRequest'
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagedFile'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/tests/reorder:
    post:
      operationId: reorderTestCases
      tags: [tests]
      summary: Set the order of all tests (owner, administrator or editor)
      description: '`test_ids` must list every test of the draft exactly once.'
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [test_ids]
              properties:
                test_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: The tests in their new order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCaseList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/tests/{testId}:
    put:
      operationId: replaceTestCase
