      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestCase'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/tests/reorder:
    post:
      operationId: reorderTestCases
      tags: [tests]
      summary: Set the order of all tests (owner or editor)
      description: '`test_ids` must list every test of the draft exactly once.'
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
