        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vd_session
      description: |
        Server-side session set by the OAuth callback. State-changing requests that carry it
        must also send `Origin` equal to the web app's origin (CSRF check, 403 otherwise).
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OAuthProvider'
    Slug:
      name: slug
      in: path
      required: true
      description: Space slug (case-insensitive)
      schema:
        type: string
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
    TrackSlug:
      name: trackSlug
      in: path
      required: true
      description: Track slug (case-insensitive), unique inside its Space
      schema:
        type: string
    CollectionSlug:
      name: collectionSlug
      in: path
      required: true
      description: Collection slug (case-insensitive), unique inside its Space
      schema:
        type: string
    ProgressUsername:
      name: username
      in: query
      description: Whose progress; defaults to the caller. Only owners and editors may name someone else.
      schema:
        type: string
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Query:
      name: q
      in: query
      description: Case-insensitive search in the Space name (public listing also matches the slug)
      schema:
        type: string
        maxLength: 80
    ProblemSlug:
      name: problemSlug
      in: path
      required: true
      description: Problem slug (case-insensitive), unique inside its Space
      schema:
        type: string
    TestId:
      name: testId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SolutionId:
      name: solutionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    OAuthProvider:
      type: string
      enum: [github, google]
    Role:
      type: string
      enum: [owner, editor, solver]
    Me:
      type: object
      description: The account owner's view. Other users never see `id` or `email`.
      required: [id, email, username, display_name, avatar_url, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        username:
          type: string
          description: 3-32 chars, lower-case letters, digits, `_` or `-`, starting with a letter or digit
        display_name:
          type: string
          maxLength: 64
        avatar_url:
          type: string
          nullable: true
          description: The sign-in provider's picture (https), refreshed at every login; null shows initials
        created_at:
          type: string
          format: date-time
    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 64
          description: No line breaks or other control characters. At most 10 changes a minute (429 after that).
        username:
          type: string
    PublicUser:
      type: object
      required: [username, display_name, avatar_url]
      properties:
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
    Space:
      type: object
      required:
        [id, name, slug, description, visibility, is_personal, archived_at, created_at, my_role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [public, private]
        is_personal:
          type: boolean
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        my_role:
          allOf:
            - $ref: '#/components/schemas/Role'
          nullable: true
          description: null for visitors and non-members
        member_count:
          type: integer
          description: Members only
    SpacePage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Space'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    CreateSpaceRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          description: Same rules as a username; not already used by a Space or a user
        description:
          type: string
          maxLength: 500
          default: ''
        visibility:
          type: string
          enum: [public, private]
          default: private
        track_name:
          type: string
          minLength: 1
          maxLength: 80
          description: Name of the Track every new Space starts with. Defaults to "General".
    UpdateSpaceRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        visibility:
          type: string
          enum: [public, private]
    Member:
      allOf:
        - $ref: '#/components/schemas/PublicUser'
        - type: object
          required: [role, joined_at]
          properties:
            role:
              $ref: '#/components/schemas/Role'
            joined_at:
              type: string
              format: date-time
    CreateInviteRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [editor, solver]
        username:
          type: string
          description: Address the invitation to one user. Omit for a link invitation.
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
    Invite:
      type: object
      required: [id, space, role, status, expires_at, created_at, invited_by, invited_user, track]
      properties:
        id:
          type: string
          format: uuid
        space:
          type: object
          required: [name, slug]
          properties:
            name:
              type: string
            slug:
              type: string
        role:
          type: string
          enum: [editor, solver]
        status:
          type: string
          enum: [pending, accepted, declined, revoked, expired]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        invited_by:
          $ref: '#/components/schemas/PublicUser'
        invited_user:
          allOf:
            - $ref: '#/components/schemas/PublicUser'
          nullable: true
        track:
          type: object
          nullable: true
          description: Set for a Track invitation. Accepting joins the Track, and the Space as a solver if needed.
          required: [name, slug]
          properties:
            name:
              type: string
            slug:
              type: string
        token:
          type: string
          description: Only in the response that creates the invitation
        link:
          type: string
          description: Web path that accepts a link invitation, only when created without `username`
    InviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invite'
    InviteOutcome:
      type: object
      required: [space, role, status, track]
      properties:
        track:
          type: object
          nullable: true
          required: [name, slug]
          properties:
            name:
              type: string
            slug:
              type: string
        space:
          type: object
          required: [name, slug]
          properties:
            name:
              type: string
            slug:
              type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum: [accepted, declined]
    Language:
      type: string
      description: Same codes as the Judge contract.
      enum: [c, cpp, python]
    ProblemStatus:
      type: string
      description: |
        `draft` was never published; `published` is open to solvers; `archived` was
        published and no longer accepts submissions.
      enum: [draft, published, archived]
    SubmissionStatus:
      type: string
      enum: [queued, running, completed]
    Verdict:
      type: string
      description: |
        Overall verdict. AC accepted, WA wrong answer, TLE time limit exceeded, MLE memory limit
        exceeded, RE runtime error, CE compilation error, OLE output limit exceeded, ISE internal
        system error (never the submitter's fault; can be checked again).
      enum: [AC, WA, TLE, MLE, RE, CE, OLE, ISE]
    TestVerdict:
      type: string
      enum: [AC, WA, TLE, MLE, RE, OLE, ISE, SKIPPED]
    Range:
      type: object
      required: [min, max, default]
      properties:
        min:
          type: integer
        max:
          type: integer
        default:
          type: integer
    TestLimits:
      type: object
      description: What the tests of one problem version may add up to.
      required: [max_count, max_total_bytes, max_file_bytes, max_sample_bytes, max_samples]
      properties:
        max_count:
          type: integer
        max_total_bytes:
          type: integer
          description: Input plus output of every test, after normalising
        max_file_bytes:
          type: integer
          description: Per input or output file, after normalising
        max_sample_bytes:
          type: integer
          description: Per file of a sample test, because samples are shown in the statement
        max_samples:
          type: integer
    ProblemConstraints:
      type: object
      description: The ranges the editor must respect, so the web app never hard-codes them.
      required:
        [
          title_max_length,
          statement_max_length,
          time_limit_ms,
          memory_limit_kb,
          languages,
          tests,
          images,
          solutions,
          source_max_bytes,
          pdf,
        ]
      properties:
        pdf:
          type: object
          required: [max_bytes, max_pages]
          properties:
            max_bytes:
              type: integer
            max_pages:
              type: integer
        title_max_length:
          type: integer
        statement_max_length:
          type: integer
        time_limit_ms:
          $ref: '#/components/schemas/Range'
        memory_limit_kb:
          $ref: '#/components/schemas/Range'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        tests:
          $ref: '#/components/schemas/TestLimits'
        images:
          type: object
          required: [max_bytes, content_types]
          properties:
            max_bytes:
              type: integer
            content_types:
              type: array
              items:
                type: string
        solutions:
          type: object
          required: [max_count]
          properties:
            max_count:
              type: integer
        source_max_bytes:
          type: integer
          description: Submissions and reference solutions
    CreateProblemRequest:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          description: 2-64 chars, lower-case letters, digits, `_` or `-`, starting with a letter or digit; not `new`, `edit` and similar words
        title:
          type: string
          minLength: 1
          maxLength: 200
        statement:
          type: string
          default: ''
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        allowed_languages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Language'
    UpdateProblemRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        statement:
          type: string
        statement_mode:
          $ref: '#/components/schemas/StatementMode'
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        allowed_languages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Language'
    SpaceRef:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
    ProblemSummary:
      type: object
      required:
        [
          id,
          slug,
          title,
          status,
          version_number,
          time_limit_ms,
          memory_limit_kb,
          allowed_languages,
          created_by,
          created_at,
          updated_at,
          published_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/ProblemStatus'
        version_number:
          type: integer
          description: The current version
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        allowed_languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        created_by:
          $ref: '#/components/schemas/PublicUser'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          nullable: true
    ProblemPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProblemSummary'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    SampleTest:
      type: object
      required: [position, input, output]
      properties:
        position:
          type: integer
          description: 1-based, in judging order
        input:
          type: string
        output:
          type: string
    StatementMode:
      type: string
      enum: [markdown, pdf]
      description: |
        `markdown`: the text in `statement`. `pdf`: an uploaded PDF. The sample tests are a separate field
        in both modes. Part of the problem version.
    PdfStatement:
      type: object
      description: The uploaded PDF of a version. Kept while Markdown mode is selected, so switching back loses nothing.
      required: [sha256, size_bytes, pages]
      properties:
        sha256:
          type: string
        size_bytes:
          type: integer
        pages:
          type: integer
    Problem:
      type: object
      description: |
        What a solver may know about a problem. Deliberately has no test count, hidden test,
        reference solution or author-only field.
      required:
        [
          id,
          slug,
          status,
          space,
          title,
          statement,
          statement_mode,
          statement_pdf,
          version_number,
          time_limit_ms,
          memory_limit_kb,
          allowed_languages,
          samples,
          accepts_submissions,
          created_by,
          published_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        status:
          $ref: '#/components/schemas/ProblemStatus'
        space:
          $ref: '#/components/schemas/SpaceRef'
        title:
          type: string
        statement:
          type: string
          description: Markdown with `$...$` and `$$...$$` maths
        statement_mode:
          $ref: '#/components/schemas/StatementMode'
        statement_pdf:
          type: object
          nullable: true
          description: Set in PDF mode. Fetch `url` with the session cookie; it is not public.
          required: [url, pages, size_bytes]
          properties:
            url:
              type: string
            pages:
              type: integer
            size_bytes:
              type: integer
        version_number:
          type: integer
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        allowed_languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        samples:
          type: array
          items:
            $ref: '#/components/schemas/SampleTest'
        accepts_submissions:
          type: boolean
          description: Published, and its Space is not archived
        created_by:
          $ref: '#/components/schemas/PublicUser'
        published_at:
          type: string
          format: date-time
          nullable: true
    ProblemVersion:
      type: object
      required:
        [
          id,
          number,
          status,
          title,
          statement,
          statement_mode,
          statement_pdf,
          time_limit_ms,
          memory_limit_kb,
          allowed_languages,
          created_at,
          updated_at,
          published_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        status:
          type: string
          enum: [draft, published]
        title:
          type: string
        statement:
          type: string
        statement_mode:
          $ref: '#/components/schemas/StatementMode'
        statement_pdf:
          allOf:
            - $ref: '#/components/schemas/PdfStatement'
          nullable: true
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        allowed_languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          nullable: true
    PublishCheck:
      type: object
      required: [key, ok, message]
      properties:
        key:
          type: string
          enum: [statement, languages, sample_test, tests, solution]
        ok:
          type: boolean
        message:
          type: string
          description: What is needed (when not ok) or what is in place (when ok)
    ProblemEditor:
      type: object
      required:
        [
          id,
          slug,
          status,
          space,
          version,
          editable,
          created_by,
          created_at,
          updated_at,
          tests,
          solutions,
          publish_checks,
          can_publish,
          constraints,
        ]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        status:
          $ref: '#/components/schemas/ProblemStatus'
        space:
          $ref: '#/components/schemas/SpaceRef'
        version:
          $ref: '#/components/schemas/ProblemVersion'
        editable:
          type: boolean
          description: The version is a draft, the problem is not archived and the Space is not archived
        created_by:
          $ref: '#/components/schemas/PublicUser'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tests:
          $ref: '#/components/schemas/TestSummary'
        solutions:
          type: object
          required: [count, has_primary]
          properties:
            count:
              type: integer
            has_primary:
              type: boolean
        publish_checks:
          type: array
          items:
            $ref: '#/components/schemas/PublishCheck'
        can_publish:
          type: boolean
          description: Every check is ok and the version is an editable draft
        constraints:
          $ref: '#/components/schemas/ProblemConstraints'
    ImageUpload:
      type: object
      required: [url, markdown, content_type, size_bytes]
      properties:
        url:
          type: string
          description: Absolute path or URL to put in the statement
        markdown:
          type: string
          description: '`![](url)`, ready to insert'
        content_type:
          type: string
        size_bytes:
          type: integer
    TestSummary:
      type: object
      required: [count, sample_count, total_bytes]
      properties:
        count:
          type: integer
        sample_count:
          type: integer
        total_bytes:
          type: integer
    TestCase:
      type: object
      description: |
        Input and expected output are stored as UTF-8 text, normalised on upload: a leading byte order mark is
        removed, CRLF and lone CR become LF, trailing blank lines are removed and a non-empty file ends with
        exactly one LF. Binary files (NUL or other control characters, invalid UTF-8) are refused.
        The SHA-256 and sizes are of the normalised content.
      required:
        [
          id,
          position,
          is_sample,
          input_sha256,
          output_sha256,
          input_size_bytes,
          output_size_bytes,
          created_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          description: 1-based; Judge runs the tests in this order
        is_sample:
          type: boolean
        input_sha256:
          type: string
        output_sha256:
          type: string
        input_size_bytes:
          type: integer
        output_size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
    TestCaseList:
      type: object
      required: [items, summary, limits, editable]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TestCase'
        summary:
          $ref: '#/components/schemas/TestSummary'
        limits:
          $ref: '#/components/schemas/TestLimits'
        editable:
          type: boolean
    ReferenceSolution:
      type: object
      required: [id, language, source, source_bytes, is_primary, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        language:
          $ref: '#/components/schemas/Language'
        source:
          type: string
        source_bytes:
          type: integer
        is_primary:
          type: boolean
        created_by:
          $ref: '#/components/schemas/PublicUser'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateReferenceSolutionRequest:
      type: object
      required: [language, source]
      properties:
        language:
          $ref: '#/components/schemas/Language'
        source:
          type: string
          minLength: 1
        is_primary:
          type: boolean
          description: Defaults to true for the first solution, false after that
    UpdateReferenceSolutionRequest:
      type: object
      minProperties: 1
      properties:
        language:
          $ref: '#/components/schemas/Language'
        source:
          type: string
          minLength: 1
        is_primary:
          type: boolean
    CreateSubmissionRequest:
      type: object
      required: [language, source]
      properties:
        language:
          $ref: '#/components/schemas/Language'
        source:
          type: string
          minLength: 1
          description: UTF-8, at most 65536 bytes
    SubmissionSummary:
      type: object
      required:
        [
          id,
          problem,
          space,
          author,
          language,
          status,
          verdict,
          time_ms,
          memory_kb,
          tests_passed,
          tests_total,
          created_at,
          judged_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        problem:
          type: object
          required: [slug, title]
          properties:
            slug:
              type: string
            title:
              type: string
        space:
          $ref: '#/components/schemas/SpaceRef'
        author:
          $ref: '#/components/schemas/PublicUser'
        language:
          $ref: '#/components/schemas/Language'
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        verdict:
          allOf:
            - $ref: '#/components/schemas/Verdict'
          nullable: true
          description: Set once `status` is `completed`
        time_ms:
          type: integer
          nullable: true
          description: Slowest test that ran
        memory_kb:
          type: integer
          nullable: true
          description: Largest peak memory of a test that ran
        tests_passed:
          type: integer
          nullable: true
        tests_total:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        judged_at:
          type: string
          format: date-time
          nullable: true
    SubmissionPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionSummary'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    SubmissionTestResult:
      type: object
      description: |
        One test, in judging order. Hidden tests carry the verdict, time and memory and nothing
        else; the previews exist for sample tests only.
      required: [position, is_sample, verdict, time_ms, memory_kb]
      properties:
        position:
          type: integer
        is_sample:
          type: boolean
        verdict:
          $ref: '#/components/schemas/TestVerdict'
        time_ms:
          type: integer
        memory_kb:
          type: integer
        stdout_preview:
          type: string
          maxLength: 1024
        checker_message:
          type: string
          maxLength: 256
    Submission:
      allOf:
        - $ref: '#/components/schemas/SubmissionSummary'
        - type: object
          required: [compile_message, error_code, results, can_rejudge]
          properties:
            source:
              type: string
              description: Missing in the events stream
            compile_message:
              type: string
              nullable: true
              description: Compiler output (at most 8192 characters) when the verdict is CE
            error_code:
              type: string
              nullable: true
              description: Why the verdict is ISE, e.g. `SANDBOX_FAILURE` or `JUDGE_UNAVAILABLE`
            results:
              type: array
              items:
                $ref: '#/components/schemas/SubmissionTestResult'
            can_rejudge:
              type: boolean
              description: The verdict is ISE and the caller may ask for another check
    Progress:
      type: object
      required: [solved, total]
      properties:
        solved:
          type: integer
        total:
          type: integer
          description: Published problems, each counted once
    TrackProblem:
      type: object
      required: [id, slug, title, status, version_number, position, solved, my_verdict]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/ProblemStatus'
        version_number:
          type: integer
        position:
          type: integer
          description: 1-based order inside the Collection
        solved:
          type: boolean
          nullable: true
          description: At least one AC; null for visitors
        my_verdict:
          allOf:
            - $ref: '#/components/schemas/Verdict'
          nullable: true
          description: AC once solved, otherwise the latest finished submission's verdict
    Collection:
      type: object
      required: [id, slug, name, description, archived_at, created_at, problem_count]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        problem_count:
          type: integer
          description: Published problems
    CollectionDetail:
      allOf:
        - $ref: '#/components/schemas/Collection'
        - type: object
          required: [problems, tracks, progress]
          properties:
            problems:
              type: array
              items:
                $ref: '#/components/schemas/TrackProblem'
            tracks:
              type: array
              nullable: true
              description: The Tracks it sits in; owners and editors only (null for others)
              items:
                type: object
                required: [id, slug, name, position]
                properties:
                  id:
                    type: string
                    format: uuid
                  slug:
                    type: string
                  name:
                    type: string
                  position:
                    type: integer
            progress:
              allOf:
                - $ref: '#/components/schemas/Progress'
              nullable: true
    CollectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionDetail'
    TrackCollection:
      allOf:
        - $ref: '#/components/schemas/Collection'
        - type: object
          required: [position, problems, progress]
          properties:
            position:
              type: integer
              description: 1-based order inside the Track
            problems:
              type: array
              items:
                $ref: '#/components/schemas/TrackProblem'
            progress:
              allOf:
                - $ref: '#/components/schemas/Progress'
              nullable: true
    TrackVisibility:
      type: string
      enum: [space, members]
      description: |
        `space`: everyone who can see the Space sees the Track. `members`: only people added to it.
        Owners and editors always see every Track.
    Track:
      type: object
      required:
        [
          id,
          slug,
          name,
          description,
          visibility,
          position,
          archived_at,
          created_at,
          collection_count,
          problem_count,
          progress,
        ]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        visibility:
          $ref: '#/components/schemas/TrackVisibility'
        position:
          type: integer
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        collection_count:
          type: integer
        problem_count:
          type: integer
        progress:
          allOf:
            - $ref: '#/components/schemas/Progress'
          nullable: true
    TrackDetail:
      allOf:
        - $ref: '#/components/schemas/Track'
        - type: object
          required: [collections]
          properties:
            collections:
              type: array
              items:
                $ref: '#/components/schemas/TrackCollection'
    TrackList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Track'
    GroupSlug:
      type: string
      description: 2-64 chars, lower-case letters, digits, `_` or `-`, starting with a letter or digit; not `new`, `members` and similar words
    CreateTrackRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          $ref: '#/components/schemas/GroupSlug'
        description:
          type: string
          maxLength: 500
          default: ''
        visibility:
          $ref: '#/components/schemas/TrackVisibility'
    UpdateTrackRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          $ref: '#/components/schemas/GroupSlug'
        description:
          type: string
          maxLength: 500
        visibility:
          $ref: '#/components/schemas/TrackVisibility'
    ReorderTracksRequest:
      type: object
      required: [track_ids]
      properties:
        track_ids:
          type: array
          items:
            type: string
            format: uuid
    CreateCollectionRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          $ref: '#/components/schemas/GroupSlug'
        description:
          type: string
          maxLength: 500
          default: ''
        track_slugs:
          type: array
          description: Tracks to put the new Collection in, at their end
          items:
            type: string
          default: []
    UpdateCollectionRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          $ref: '#/components/schemas/GroupSlug'
        description:
          type: string
          maxLength: 500
    ProblemSlugsRequest:
      type: object
      required: [problem_slugs]
      properties:
        problem_slugs:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
    CollectionSlugsRequest:
      type: object
      required: [collection_slugs]
      properties:
        collection_slugs:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
    ReorderProblemsRequest:
      type: object
      required: [problem_ids]
      properties:
        problem_ids:
          type: array
          items:
            type: string
            format: uuid
    ReorderCollectionsRequest:
      type: object
      required: [collection_ids]
      properties:
        collection_ids:
          type: array
          items:
            type: string
            format: uuid
    TrackMember:
      allOf:
        - $ref: '#/components/schemas/PublicUser'
        - type: object
          required: [space_role, joined_at]
          properties:
            space_role:
              allOf:
                - $ref: '#/components/schemas/Role'
              nullable: true
            joined_at:
              type: string
              format: date-time
    TrackMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackMember'
    CreateTrackInviteRequest:
      type: object
      properties:
        username:
          type: string
          description: Address the invitation to one user. Omit for a link invitation.
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
    UserProgress:
      type: object
      required: [user, progress, collections]
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        progress:
          $ref: '#/components/schemas/Progress'
        collections:
          type: array
          items:
            type: object
            required: [id, slug, name, progress, problems]
            properties:
              id:
                type: string
                format: uuid
              slug:
                type: string
              name:
                type: string
              progress:
                $ref: '#/components/schemas/Progress'
              problems:
                type: array
                items:
                  type: object
                  required: [id, slug, title, solved]
                  properties:
                    id:
                      type: string
                      format: uuid
                    slug:
                      type: string
                    title:
                      type: string
                    solved:
                      type: boolean
    MemberProgress:
      type: object
      required: [user, role, progress, collections]
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        role:
          $ref: '#/components/schemas/Role'
        progress:
          $ref: '#/components/schemas/Progress'
        collections:
          type: array
          items:
            type: object
            required: [id, slug, name, progress]
            properties:
              id:
                type: string
                format: uuid
              slug:
                type: string
              name:
                type: string
              progress:
                $ref: '#/components/schemas/Progress'
    MemberProgressList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MemberProgress'
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: boolean
    ErrorResponse:
      type: object
      description: The one error shape used by every Verdale service.
      required: [status, error_code, message, request_id]
      properties:
        status:
          type: integer
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
