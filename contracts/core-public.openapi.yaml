          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/submissions/by-member:
    get:
      operationId: listSubmissionsByMember
      tags: [submissions]
      summary: Submissions rolled up per person (owner, administrator, editor, observer)
      description: |
        One row per member, plus anyone who submitted to a public Space without joining it
        (`role` is then null). `hide_empty` (default true) drops people with no submission in
        the window. `role=none` keeps people without a role. `track` is a Track slug or `none`.
        `window` limits the counted submissions to the last 7 or 30 days.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Search in the username and display name
          schema:
            type: string
            maxLength: 80
        - name: role
          in: query
          schema:
            type: string
            enum: [owner, administrator, editor, observer, solver, none]
        - name: track
          in: query
          schema:
            type: string
            maxLength: 80
        - $ref: '#/components/parameters/SubmissionWindow'
        - name: sort
          in: query
          schema:
            type: string
            enum: [last_submission, solved, name]
            default: last_submission
        - name: hide_empty
          in: query
          schema:
            type: string
            enum: ['true', 'false']
            default: 'true'
      responses:
        '200':
          description: A page of member rollups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberRollupPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/submissions/by-member/{username}/problems:
    get:
      operationId: listMemberProblems
      tags: [submissions]
      summary: The problems one person tried (owner, administrator, editor, observer)
      description: |
        Second page of "by member". 404 for a user who is neither a member nor has submitted
        in this Space. The response carries the person's rollup as `member`.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Search in the problem slug and title
          schema:
            type: string
            maxLength: 80
        - name: track
          in: query
          description: Track slug, or `none`
          schema:
            type: string
            maxLength: 80
        - name: status
          in: query
          schema:
            type: string
            enum: [all, solved, unsolved]
            default: all
        - name: sort
          in: query
          schema:
            type: string
            enum: [last_submission, attempts, name]
            default: last_submission
      responses:
        '200':
          description: A page of problems with the person's results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberProblemPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/submissions/by-track:
    get:
      operationId: listSubmissionsByTrack
      tags: [submissions]
      summary: Submissions rolled up per Track (owner, administrator, editor, observer)
      description: |
        One row per active Track, not paged. `members` is the Track's audience (its members when
        the Track is members-only, otherwise every member of the Space); `members_finished` counts
        those who solved every published problem of the Track.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - name: q
          in: query
          description: Search in the Track name and slug
          schema:
            type: string
            maxLength: 80
        - name: privacy
          in: query
          schema:
            $ref: '#/components/schemas/TrackPrivacy'
        - $ref: '#/components/parameters/SubmissionWindow'
        - name: sort
          in: query
          schema:
            type: string
            enum: [track_order, last_submission, submissions]
            default: track_order
      responses:
        '200':
          description: Tracks with their numbers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrackRollup'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/submissions/by-track/{trackSlug}/problems:
    get:
      operationId: listTrackSubmissionProblems
      tags: [submissions]
      summary: The problems of a Track with how people got on (owner, administrator, editor, observer)
      description: |
        Not paged. Drafts and archived problems of the Track are included (`status` filters
        them), which solvers never see. `most_common_failure` is the most frequent failing
        verdict and test of the problem within this Track. 404 for an unknown Track.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/TrackSlug'
        - name: q
          in: query
          description: Search in the problem slug and title
          schema:
            type: string
            maxLength: 80
        - name: collection
          in: query
          description: Collection slug
          schema:
            type: string
            maxLength: 80
        - name: status
          in: query
          schema:
            type: string
            enum: [all, published, draft, archived]
            default: all
        - name: sort
          in: query
          schema:
            type: string
            enum: [track_order, solved_fewest, last_submission]
            default: track_order
      responses:
        '200':
          description: The Track and its problems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackSubmissionProblems'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/submissions/by-problem:
    get:
      operationId: listSubmissionsByProblem
      tags: [submissions]
      summary: Submissions rolled up per problem (owner, administrator, editor, observer)
      description: |
        `track` is a Track slug, or `none` for problems that sit in no active Track.
        `status` filters the problem status.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Search in the problem slug and title
          schema:
            type: string
            maxLength: 80
        - name: track
          in: query
          schema:
            type: string
            maxLength: 80
        - name: status
          in: query
          schema:
            type: string
            enum: [all, published, draft, archived]
            default: all
        - name: sort
          in: query
          schema:
            type: string
            enum: [last_submission, submissions, solved_fewest, name]
            default: last_submission
      responses:
        '200':
          description: A page of problem rollups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemRollupPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/submissions/{submissionId}:
    get:
      operationId: getSubmission
      tags: [submissions]
      summary: One submission with its source and per-test results
      description: |
        Visible to its author, and to owners, administrators, editors and observers of the Space (decision log, GRD-46).
        Anyone else gets 404. Results never contain the content of a hidden test; previews
        exist for sample tests only.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: The submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/submissions/{submissionId}/tests/{position}:
    get:
      operationId: getSubmissionTest
      tags: [submissions]
      summary: One test of a submission, hidden tests included (owner, administrator, editor, observer)
      description: |
        The input, the expected output, what the program printed and its standard error, as
        windows of lines. Only people who may read hidden tests reach it; anyone else, the author
        included, gets 404 (the author reads samples in `getSubmission`). Core asks Judge to keep
        the start of each test's output (64 KiB of stdout and 8 KiB of stderr), so `output` and
        `stderr` can be `cut`. Use `part` to fetch one of the four, the others are then null.
        `input` or `expected` that cannot be read are `unavailable`.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
        - name: position
          in: path
          required: true
          description: 1-based position of the test in the judging order
          schema:
            type: integer
            minimum: 1
            maximum: 100000
        - name: part
          in: query
          schema:
            type: string
            enum: [input, expected, output, stderr]
        - $ref: '#/components/parameters/FromLine'
        - $ref: '#/components/parameters/MaxLines'
      responses:
        '200':
          description: The test with its windows of text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionTestDetail'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/submissions/{submissionId}/events:
    get:
      operationId: streamSubmission
      tags: [submissions]
      summary: Live status (Server-Sent Events)
      description: |
        `text/event-stream`. The first event, `submission`, is the current state; another follows
        every change; the stream ends after the final one. Each event's data is a `Submission`
        without `source`. A comment line is sent every 15 s to keep proxies open, and
        `retry: 3000` tells the browser to reconnect after 3 s; every connection starts with the
        current state, so a dropped connection loses nothing. Clients without `EventSource`
        can poll `getSubmission` instead.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/submissions/{submissionId}/rejudge:
    post:
      operationId: rejudgeSubmission
      tags: [submissions]
      summary: Check a submission again after a system error
      description: |
        Only when the verdict is `ISE` (never the submitter's fault). The author or an owner
        or editor of the Space can do it. Anything else is 409.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '202':
          description: Queued again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
components:
  responses:
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vd_session
      description: |
        Server-side session set by the OAuth callback. State-changing requests that carry it
        must also send `Origin` equal to the web app's origin (CSRF check, 403 otherwise).
  parameters:
    Provider:
      name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OAuthProvider'
    Slug:
      name: slug
      in: path
      required: true
      description: Space slug (case-insensitive)
      schema:
        type: string
    Username:
      name: username
      in: path
      required: true
      schema:
        type: string
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    TrackSlug:
      name: trackSlug
      in: path
      required: true
      description: Track slug, unique inside its Space
      schema:
        type: string
    CollectionSlug:
      name: collectionSlug
      in: path
      required: true
      description: Collection slug, unique inside its Space
      schema:
        type: string
    IncludeArchived:
      name: include_archived
      in: query
      description: Staff only; others never see archived items
      schema:
        type: boolean
        default: false
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Query:
      name: q
      in: query
      description: Case-insensitive search in the Space name (public listing also matches the slug)
      schema:
        type: string
        maxLength: 80
    ProblemSlug:
      name: problemSlug
      in: path
      required: true
      description: Problem slug (case-insensitive), unique inside its Space
      schema:
        type: string
    TestId:
      name: testId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SolutionId:
      name: solutionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FromLine:
      name: from_line
      in: query
      description: 1-based number of the first line of the window
      schema:
        type: integer
        minimum: 1
        maximum: 100000000
        default: 1
    MaxLines:
      name: max_lines
      in: query
      description: Lines in the window
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 10
    SubmissionWindow:
      name: window
      in: query
      description: Count only submissions of the last 7 or 30 days
      schema:
        type: string
        enum: [any, 7d, 30d]
        default: any
  schemas:
    OAuthProvider:
      type: string
      enum: [github, google]
    Role:
      type: string
      description: |
        Strongest first: owner > administrator > editor > observer > solver. A visitor or
        a signed-in non-member is a "viewer" and has no stored role (`my_role` is null).
        Exactly one owner per Space.
      enum: [owner, administrator, editor, observer, solver]
    Me:
      type: object
      description: The account owner's view. Other users never see `id` or `email`.
      required: [id, email, username, display_name, avatar_url, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        username:
          type: string
          description: 3-32 chars, lower-case letters, digits, `_` or `-`, starting with a letter or digit
        display_name:
          type: string
          maxLength: 64
        avatar_url:
          type: string
          nullable: true
          description: >-
            The sign-in provider's profile picture (https URL), refreshed at every sign-in.
            Null when the provider has none: show the initials of `display_name`.
        created_at:
          type: string
          format: date-time
    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 64
          description: Trimmed; no control characters. Rate limited (429).
        username:
          type: string
    PublicUser:
      type: object
      required: [username, display_name, avatar_url]
      properties:
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
          nullable: true
    Space:
      type: object
      required:
        [id, name, slug, description, visibility, is_personal, archived_at, created_at, my_role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [public, private]
        is_personal:
          type: boolean
        archived_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        my_role:
          allOf:
            - $ref: '#/components/schemas/Role'
          nullable: true
          description: null for visitors and non-members
        member_count:
          type: integer
          description: Members only
    SpacePage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Space'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    CreateSpaceRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          description: Same rules as a username; not already used by a Space or a user
        description:
          type: string
          maxLength: 500
          default: ''
        visibility:
          type: string
          enum: [public, private]
          default: private
        track_name:
          type: string
          minLength: 1
          maxLength: 80
          description: Name of the Track every Space starts with. "General" when left out.
    UpdateSpaceRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        visibility:
          type: string
          enum: [public, private]
    Member:
      allOf:
        - $ref: '#/components/schemas/PublicUser'
        - type: object
          required: [role, joined_at]
          properties:
            role:
              $ref: '#/components/schemas/Role'
            joined_at:
              type: string
              format: date-time
    CreateInviteRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          description: An administrator can only invite editor, observer or solver.
          enum: [administrator, editor, observer, solver]
        username:
          type: string
          description: Address the invitation to one user. Omit for a link invitation.
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
    Invite:
      type: object
      required: [id, space, track, role, status, expires_at, created_at, invited_by, invited_user]
      properties:
        id:
          type: string
          format: uuid
        space:
          type: object
          required: [name, slug]
          properties:
            name:
              type: string
            slug:
              type: string
        track:
          type: object
          nullable: true
          description: Set for an invitation to one Track; accepting it makes the person a solver of the Space
          required: [name, slug]
          properties:
            name:
              type: string
            slug:
              type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum: [pending, accepted, declined, revoked, expired]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        invited_by:
          $ref: '#/components/schemas/PublicUser'
        invited_user:
          allOf:
            - $ref: '#/components/schemas/PublicUser'
          nullable: true
        token:
          type: string
          description: Only in the response that creates the invitation
        link:
          type: string
          description: Web path that accepts a link invitation, only when created without `username`
    InviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invite'
    InviteOutcome:
      type: object
      required: [space, track, role, status]
      properties:
        space:
          type: object
          required: [name, slug]
          properties:
            name:
              type: string
            slug:
              type: string
        track:
          type: object
          nullable: true
          description: Set for an invitation to one Track; accepting it makes the person a solver of the Space
          required: [name, slug]
          properties:
            name:
              type: string
            slug:
              type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          type: string
          enum: [accepted, declined]
    Language:
      type: string
      description: Same codes as the Judge contract.
      enum: [c, cpp, python]
    ProblemStatus:
      type: string
      description: |
        `draft` was never published; `published` is open to solvers; `archived` was
        published and no longer accepts submissions.
      enum: [draft, published, archived]
    SubmissionStatus:
      type: string
      enum: [queued, running, completed]
    Verdict:
      type: string
      description: |
        Overall verdict. AC accepted, WA wrong answer, TLE time limit exceeded, MLE memory limit
        exceeded, RE runtime error, CE compilation error, OLE output limit exceeded, ISE internal
        system error (never the submitter's fault; can be checked again).
      enum: [AC, WA, TLE, MLE, RE, CE, OLE, ISE]
    TestVerdict:
      type: string
      enum: [AC, WA, TLE, MLE, RE, OLE, ISE, SKIPPED]
    Range:
      type: object
      required: [min, max, default]
      properties:
        min:
          type: integer
        max:
          type: integer
        default:
          type: integer
    TestLimits:
      type: object
      description: What the tests of one problem version may add up to.
      required: [max_count, max_total_bytes, max_file_bytes, max_sample_bytes, max_samples]
      properties:
        max_count:
          type: integer
        max_total_bytes:
          type: integer
          description: Input plus output of every test, after normalising
        max_file_bytes:
          type: integer
          description: Per input or output file, after normalising
        max_sample_bytes:
          type: integer
          description: Per file of a sample test, because samples are shown in the statement
        max_samples:
          type: integer
    ProblemConstraints:
      type: object
      description: The ranges the editor must respect, so the web app never hard-codes them.
      required:
        [
          title_max_length,
          statement_max_length,
          time_limit_ms,
          memory_limit_kb,
          languages,
          tests,
          images,
          statement_pdf,
          solutions,
          source_max_bytes,
        ]
      properties:
        title_max_length:
          type: integer
        statement_max_length:
          type: integer
        time_limit_ms:
          $ref: '#/components/schemas/Range'
        memory_limit_kb:
          $ref: '#/components/schemas/Range'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        tests:
          $ref: '#/components/schemas/TestLimits'
        statement_pdf:
          type: object
          description: Limits of an uploaded PDF statement.
          required: [max_bytes, max_pages]
          properties:
            max_bytes:
              type: integer
            max_pages:
              type: integer
        images:
          type: object
          required: [max_bytes, content_types]
          properties:
            max_bytes:
              type: integer
            content_types:
              type: array
              items:
                type: string
        solutions:
          type: object
          required: [max_count]
          properties:
            max_count:
              type: integer
        source_max_bytes:
          type: integer
          description: Submissions and reference solutions
    CreateProblemRequest:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          description: 2-64 chars, lower-case letters, digits, `_` or `-`, starting with a letter or digit; not `new`, `edit` and similar words
        title:
          type: string
          minLength: 1
          maxLength: 200
        statement:
          type: string
          default: ''
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        allowed_languages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Language'
    UpdateProblemRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        statement:
          type: string
        statement_mode:
          $ref: '#/components/schemas/StatementMode'
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        allowed_languages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Language'
    SpaceRef:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
    ProblemSummary:
      type: object
      required:
        [
          id,
          slug,
          title,
          status,
          version_number,
          time_limit_ms,
          memory_limit_kb,
          allowed_languages,
          created_by,
          created_at,
          updated_at,
          published_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/ProblemStatus'
        version_number:
          type: integer
          description: The current version
        time_limit_ms:
          type: integer
        memory_limit_kb:
