openapi: 3.0.3
info:
  title: Verdale Core public API
  version: 0.3.0
  description: |
    Public HTTP API of Core service, consumed by the Frontend.
    Endpoints are added story by story: accounts and Spaces (M2), problems, tests,
    reference solutions and submissions (M3). Everything except `/health` and `/ready` lives under `/api/v1`,
    the prefix the web app proxies to Core.

    Every error uses `ErrorResponse`. Every response carries an
    `X-Request-Id` header; when the request sends a UUID in `X-Request-Id`,
    Core reuses it.
servers:
  - url: http://localhost:8080
    description: Local Core
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      operationId: getReady
      summary: Readiness probe (database reachable)
      responses:
        '200':
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: A dependency is down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/auth/providers:
    get:
      operationId: listAuthProviders
      tags: [auth]
      summary: Sign-in methods that are enabled (for the login buttons)
      responses:
        '200':
          description: Enabled providers
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthProvider'
  /api/v1/auth/oauth/{provider}/start:
    get:
      operationId: startOAuth
      tags: [auth]
      summary: Begin sign-in with a provider
      description: |
        Navigate the browser here (not fetch). Core sets a short-lived signed
        cookie and redirects to the provider. Rate limited per client.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: redirect
          in: query
          description: Relative path to open after sign-in. Anything else is replaced by `/`.
          schema:
            type: string
            maxLength: 512
      responses:
        '302':
          description: Redirect to the provider
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/oauth/{provider}/callback:
    get:
      operationId: finishOAuth
      tags: [auth]
      summary: Provider redirect target (browser navigation)
      description: |
        Registered at the provider as `{FRONTEND_ORIGIN}/api/v1/auth/oauth/{provider}/callback`.
        On success sets the `vd_session` cookie (httpOnly, SameSite=Lax, Secure outside local,
        30 days) and redirects to the requested page. On any failure redirects to
        `{FRONTEND_ORIGIN}/login?error=<code>` where code is `access_denied`, `bad_request`
        or `not_found`. Never returns JSON.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the web app
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      description: Deletes the session on the server, so the cookie stops working even if kept.
      responses:
        '204':
          description: Logged out (also when there was no session)
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/me:
    get:
      operationId: getMe
      tags: [users]
      summary: My account
      security:
        - session: []
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateMe
      tags: [users]
      summary: Change display name and/or username
      description: |
        Changing the username also renames the personal Space's slug in the same step.
        Usernames and Space slugs share one namespace.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/users/{username}:
    get:
      operationId: getUser
      tags: [users]
      summary: Public profile (username and display name only)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/me/spaces:
    get:
      operationId: listMySpaces
      tags: [spaces]
      summary: Spaces I belong to, with my role
      description: Personal Space first, then by name. Archived Spaces are listed separately with `archived=true`.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Query'
        - name: archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A page of Spaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpacePage'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/me/invites:
    get:
      operationId: listMyInvites
      tags: [invites]
      summary: Pending invitations addressed to me
      security:
        - session: []
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteList'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/me/invites/{inviteId}/accept:
    post:
      operationId: acceptMyInvite
      tags: [invites]
      summary: Accept an invitation addressed to me
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '200':
          description: Joined the Space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteOutcome'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/me/invites/{inviteId}/decline:
    post:
      operationId: declineMyInvite
      tags: [invites]
      summary: Decline an invitation addressed to me
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteOutcome'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/spaces:
    get:
      operationId: listPublicSpaces
      tags: [spaces]
      summary: Browse and search public, active Spaces
      description: Private Spaces never appear, whoever asks and whatever the query. No login needed.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: A page of Spaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpacePage'
        '400':
          $ref: '#/components/responses/Error'
    post:
      operationId: createSpace
      tags: [spaces]
      summary: Create a Space (the caller becomes its owner)
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpaceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}:
    get:
      operationId: getSpace
      tags: [spaces]
      summary: Read a Space
      description: |
        Public Spaces are readable without logging in. A private Space answers 404 to
        everyone who is not a member, exactly like a Space that does not exist.
        `member_count` is present for members only.
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: The Space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateSpace
      tags: [spaces]
      summary: Edit name, description or visibility (owner only; the slug never changes)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpaceRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/archive:
    post:
      operationId: archiveSpace
      tags: [spaces]
      summary: Archive a Space (owner only)
      description: |
        Problems stay readable but nothing can be created, edited, published or submitted,
        and settings and members are frozen. A personal Space cannot be archived (409).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: Members of a Space (members only)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Members, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/members/{username}:
    patch:
      operationId: changeMemberRole
      tags: [members]
      summary: Change a member's role (owner only)
      description: Demoting the last owner is refused with 409.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Username'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeMember
      tags: [members]
      summary: Remove a member (owner only)
      description: Removing the last owner is refused with 409.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Username'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/leave:
    post:
      operationId: leaveSpace
      tags: [members]
      summary: Leave a Space
      description: The last owner cannot leave (409). Allowed in an archived Space.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '204':
          description: Left
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/invites:
    get:
      operationId: listSpaceInvites
      tags: [invites]
      summary: Pending, unexpired invitations of a Space (owner only)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: createInvite
      tags: [invites]
      summary: Invite by link, or by username (owner only)
      description: |
        Without `username` the result carries a `link` that anyone logged in can use once.
        With `username` only that user can answer it. The `token` is returned once and only
        its hash is stored. Invitations never grant `owner`.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/invites/{inviteId}:
    delete:
      operationId: revokeInvite
      tags: [invites]
      summary: Revoke a pending invitation (owner only)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/InviteId'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/invites/{token}:
    get:
      operationId: previewInvite
      tags: [invites]
      summary: What the holder of an invitation link sees (no login needed)
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: The invitation, with `status` pending, accepted, declined, revoked or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/invites/{token}/accept:
    post:
      operationId: acceptInvite
      tags: [invites]
      summary: Accept an invitation by its link token
      description: |
        410 when it is expired, revoked, already used, or its Space is archived.
        409 when you are already a member (the invitation is not used up).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: Joined the Space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteOutcome'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/invites/{token}/decline:
    post:
      operationId: declineInvite
      tags: [invites]
      summary: Decline an invitation by its link token
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteOutcome'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems:
    get:
      operationId: listProblems
      tags: [problems]
      summary: Problems of a Space
      description: |
        Visitors and solvers only ever see `published` problems, whatever `status` says.
        Owners and editors can also list `draft` and `archived` problems, or `all`
        (default `published`); `mine=true` keeps the ones they created.
        A private Space answers 404 to everyone who is not a member.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Case-insensitive search in the title and the slug
          schema:
            type: string
            maxLength: 80
        - name: status
          in: query
          description: Owners and editors only; ignored for everyone else
          schema:
            type: string
            enum: [published, draft, archived, all]
            default: published
        - name: mine
          in: query
          description: Owners and editors only; only problems I created
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A page of problems, newest change first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemPage'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: createProblem
      tags: [problems]
      summary: Start a draft problem (owner or editor)
      description: |
        Creates the problem with an empty draft (version 1). Fill it with `PATCH`.
        Not allowed in an archived Space.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProblemRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}:
    get:
      operationId: getProblem
      tags: [problems]
      summary: A problem as the solver sees it
      description: |
        The statement, limits, allowed languages and the sample tests, nothing else:
        hidden tests, reference solutions and internal data are never sent here.
        A draft problem answers 404 unless the caller is an owner or editor of the Space,
        who then sees exactly what solvers will see (a preview). Archived problems stay
        readable but report `accepts_submissions: false`.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '200':
          description: The problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateProblem
      tags: [problems]
      summary: Edit the draft (owner or editor)
      description: |
        Changes title, statement, limits or allowed languages of the draft version.
        A published version never changes: 409 `VERSION_PUBLISHED`.
        Limits outside the ranges in `constraints` are refused with a `details` entry per field.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProblemRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteProblem
      tags: [problems]
      summary: Delete a draft problem (owner or editor)
      description: A problem that has been published cannot be deleted; archive it instead (409).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/editor:
    get:
      operationId: getProblemEditor
      tags: [problems]
      summary: Everything the editor needs (owner or editor)
      description: |
        The draft (or, when there is none, the current version), the numbers behind
        the test and solution lists, the publish checklist and the allowed ranges.
        Readable in an archived Space; `editable` says whether it can be changed.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '200':
          description: The editor view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/publish:
    post:
      operationId: publishProblem
      tags: [problems]
      summary: Publish the draft (owner or editor)
      description: |
        Makes the draft the published, immutable version. Needs a statement, at least
        one sample test, one test in total, one allowed language and a primary reference
        solution; otherwise 409 `PUBLISH_BLOCKED` with one `details` entry per missing item.
        Provisional: Milestone 4 puts the verification run (reference solution against
        every test on Judge) in front of this step.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/archive:
    post:
      operationId: archiveProblem
      tags: [problems]
      summary: Archive a published problem (owner or editor)
      description: It stays readable but no longer accepts submissions. A never-published draft is deleted instead (409).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/images:
    post:
      operationId: uploadProblemImage
      tags: [problems]
      summary: Upload a picture for the statement (owner or editor)
      description: |
        `multipart/form-data` with one `file` part: png, jpeg or webp, at most `constraints.images.max_bytes`.
        The type is read from the bytes, not the file name. The stored name is random.
        Returns the public URL and a ready-to-paste Markdown image.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUpload'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/assets/{name}:
    get:
      operationId: getAsset
      tags: [problems]
      summary: A statement picture
      description: |
        Served by Core only when the public bucket has no public URL of its own
        (`PUBLIC_ASSET_BASE_URL`), as in local development. Immutable and cacheable.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
