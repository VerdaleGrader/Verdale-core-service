        reference solution or author-only field.
      required:
        [
          id,
          slug,
          status,
          space,
          title,
          statement,
          statement_mode,
          statement_pdf,
          version_number,
          time_limit_ms,
          memory_limit_kb,
          allowed_languages,
          samples,
          accepts_submissions,
          created_by,
          published_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        status:
          $ref: '#/components/schemas/ProblemStatus'
        space:
          $ref: '#/components/schemas/SpaceRef'
        title:
          type: string
        statement:
          type: string
          description: Markdown with `$...$` and `$$...$$` maths. Empty in `pdf` mode.
        statement_mode:
          $ref: '#/components/schemas/StatementMode'
        statement_pdf:
          type: object
          nullable: true
          description: The PDF in `pdf` mode; fetch it from `GET .../statement.pdf`.
