                  items:
                    type: array
                    items:
                      type: integer
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/submissions/by-member:
    get:
      operationId: listSubmissionsByMember
      tags: [submissions]
      summary: Submissions rolled up per person (owner, administrator, editor, observer)
      description: |
        One row per member, plus anyone who submitted to a public Space without joining it
        (`role` is then null). `hide_empty` (default true) drops people with no submission in
        the window. `role=none` keeps people without a role. `track` is a Track slug or `none`.
        `window` limits the counted submissions to the last 7 or 30 days.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Search in the username and display name
          schema:
            type: string
            maxLength: 80
        - name: role
          in: query
          schema:
            type: string
            enum: [owner, administrator, editor, observer, solver, none]
        - name: track
          in: query
          schema:
            type: string
            maxLength: 80
        - $ref: '#/components/parameters/SubmissionWindow'
        - name: sort
          in: query
          schema:
            type: string
            enum: [last_submission, solved, name]
            default: last_submission
        - name: hide_empty
          in: query
          schema:
            type: string
            enum: ['true', 'false']
            default: 'true'
      responses:
        '200':
          description: A page of member rollups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberRollupPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/submissions/by-member/{username}/problems:
    get:
      operationId: listMemberProblems
      tags: [submissions]
      summary: The problems one person tried (owner, administrator, editor, observer)
      description: |
        Second page of "by member". 404 for a user who is neither a member nor has submitted
        in this Space. The response carries the person's rollup as `member`.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Page'
