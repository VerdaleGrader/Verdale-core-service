        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/editor:
    get:
      operationId: getProblemEditor
      tags: [problems]
      summary: Everything the editor needs (owner or editor)
      description: |
        The draft (or, when there is none, the current version), the numbers behind
        the test and solution lists, the publish checklist and the allowed ranges.
        Readable in an archived Space; `editable` says whether it can be changed.
      security:
        - session: []
      parameters:
