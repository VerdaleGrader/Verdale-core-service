          type: boolean
        input:
          $ref: '#/components/schemas/TestFileRef'
        output:
          $ref: '#/components/schemas/TestFileRef'
    SaveTestCasesRequest:
      type: object
      required: [tests]
      properties:
        revision:
          type: string
          maxLength: 64
          description: The `revision` of the list the changes started from
        tests:
          type: array
          maxItems: 500
          description: The testcases the problem should have afterwards, in order; those not listed are removed
          items:
            $ref: '#/components/schemas/SaveTestCaseItem'
    TestFileSlice:
      allOf:
        - $ref: '#/components/schemas/TextSlice'
        - type: object
          required: [position, side]
          properties:
            position:
              type: integer
              description: Position of the testcase
            side:
              type: string
              enum: [input, output]
    StartGenerateRequest:
      type: object
      required: [solution_id]
      properties:
        solution_id:
          type: string
          format: uuid
          description: A reference solution of this problem
        test_ids:
          type: array
          minItems: 1
          maxItems: 500
          description: Testcases to run, each once; the others keep what they have. All of them when left out
          items:
            type: string
            format: uuid
    GenerateRun:
      type: object
      required:
        [
          test_id,
          position,
          status,
          verdict,
          error_code,
          time_ms,
          memory_kb,
          stderr,
          output,
          same_as_current,
        ]
      properties:
        test_id:
          type: string
          format: uuid
        position:
          type: integer
        status:
          type: string
          enum: [queued, running, done, failed]
        verdict:
          type: string
          nullable: true
          description: Why a run failed, one of TLE, MLE, RE, OLE, ISE
        error_code:
          type: string
          nullable: true
          description: e.g. `COMPILE_ERROR`, `NO_OUTPUT` or `JUDGE_UNAVAILABLE`
        time_ms:
          type: integer
          nullable: true
        memory_kb:
          type: integer
          nullable: true
        stderr:
          type: string
          nullable: true
          description: The start of the standard error (at most 1000 characters)
        output:
          type: object
          nullable: true
          description: The generated expected output, ready to be put in `saveTestCases`
          required: [sha256, size_bytes]
          properties:
            sha256:
              type: string
            size_bytes:
              type: integer
        same_as_current:
          type: boolean
          nullable: true
          description: |
            The output equals the testcase's current expected output as Judge compares (trailing
            spaces and trailing blank lines do not count); null when there is nothing to compare
    GenerateJob:
      type: object
      required: [id, status, error, created_at, deadline_at, finished_at, progress, runs]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, completed, stopped, timed_out, failed]
        error:
          type: object
          nullable: true
          description: Set when the job failed as a whole, e.g. `COMPILE_ERROR` when the solution does not compile
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        created_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        progress:
          type: object
          required: [total, done, failed]
          properties:
            total:
              type: integer
            done:
              type: integer
            failed:
              type: integer
        runs:
          type: array
          description: In testcase order
          items:
            $ref: '#/components/schemas/GenerateRun'
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            type: boolean
    ErrorResponse:
      type: object
      description: The one error shape used by every Verdale service.
      required: [status, error_code, message, request_id]
      properties:
        status:
          type: integer
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    TrackPrivacy:
      type: string
      description: >-
        `space`: everyone who can see the Space can see the Track. `members`: only people added to
        the Track (staff always see every Track).
      enum: [space, members]
    Progress:
      type: object
      description: >-
        Problems solved (at least one accepted submission, any version) out of the published
        problems in the non-archived Collections of the Track. A problem counts once.
      required: [solved, total]
      properties:
        solved:
          type: integer
        total:
          type: integer
    Track:
      type: object
      required: [id, name, slug, description, privacy, position, archived, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          description: 2-64 chars, lower-case letters, digits, `-` or `_`; unique in the Space, also when archived
        description:
          type: string
          maxLength: 500
        privacy:
          $ref: '#/components/schemas/TrackPrivacy'
        position:
          type: integer
          minimum: 1
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TrackSummary:
      allOf:
        - $ref: '#/components/schemas/Track'
        - type: object
          required: [collection_count, problem_count, progress, is_member]
          properties:
            collection_count:
              type: integer
            problem_count:
              type: integer
              description: Published problems that count towards progression
            progress:
              allOf:
                - $ref: '#/components/schemas/Progress'
              nullable: true
              description: The caller's own progression; null for a visitor
            is_member:
              type: boolean
              description: Added to this Track by an invitation
    CreateTrackRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          description: Derived from the name when left out (the name must then contain latin letters or digits)
        description:
          type: string
          maxLength: 500
        privacy:
          $ref: '#/components/schemas/TrackPrivacy'
    UpdateTrackRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        privacy:
          $ref: '#/components/schemas/TrackPrivacy'
        archived:
          type: boolean
    ReorderTracksRequest:
      type: object
      required: [track_slugs]
      properties:
        track_slugs:
          type: array
          items:
            type: string
    SetTrackCollectionsRequest:
      type: object
      required: [collection_slugs]
      properties:
        collection_slugs:
          type: array
          description: Exactly the Collections the Track should have, in order
          items:
            type: string
    ProblemRef:
      type: object
      required: [slug, title, status, my_result]
      properties:
        slug:
          type: string
        title:
          type: string
        status:
          type: string
          description: Solvers only ever see `published`
          enum: [draft, published, archived]
        my_result:
          type: object
          nullable: true
          description: The caller's own result; null for a visitor
          required: [solved, last_verdict]
          properties:
            solved:
              type: boolean
            last_verdict:
              type: string
              nullable: true
              description: Verdict of the latest finished submission, null when there is none
    Collection:
      type: object
      required: [id, name, slug, description, archived, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
        slug:
          type: string
        description:
          type: string
          maxLength: 500
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CollectionSummary:
      allOf:
        - $ref: '#/components/schemas/Collection'
        - type: object
          required: [problem_count, tracks]
          properties:
            problem_count:
              type: integer
              description: Published problems for solvers, all problems for staff
            tracks:
              type: array
              description: The Tracks (that the caller can reach) this Collection is in
              items:
                type: object
                required: [name, slug]
                properties:
                  name:
                    type: string
                  slug:
                    type: string
    CollectionDetail:
      allOf:
        - $ref: '#/components/schemas/CollectionSummary'
        - type: object
          required: [space, problems, progress]
          properties:
            space:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                slug:
                  type: string
            problems:
              type: array
              items:
                $ref: '#/components/schemas/ProblemRef'
            progress:
              allOf:
                - $ref: '#/components/schemas/Progress'
              nullable: true
    CollectionInTrack:
      allOf:
        - $ref: '#/components/schemas/Collection'
        - type: object
          required: [problems, progress]
          properties:
            problems:
              type: array
              items:
                $ref: '#/components/schemas/ProblemRef'
            progress:
              allOf:
                - $ref: '#/components/schemas/Progress'
              nullable: true
    TrackDetail:
      allOf:
        - $ref: '#/components/schemas/Track'
        - type: object
          required: [space, collections, progress, member_count]
          properties:
            space:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                slug:
                  type: string
            collections:
              type: array
              items:
                $ref: '#/components/schemas/CollectionInTrack'
            progress:
              allOf:
                - $ref: '#/components/schemas/Progress'
              nullable: true
            member_count:
              type: integer
              nullable: true
              description: Only for people who manage the Track
    CreateCollectionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
        description:
          type: string
          maxLength: 500
    UpdateCollectionRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        archived:
          type: boolean
    SetCollectionProblemsRequest:
      type: object
      required: [problem_slugs]
      properties:
        problem_slugs:
          type: array
          description: Exactly the problems the Collection should have, in order
          items:
            type: string
    ChangeCollectionProblemsRequest:
      type: object
      properties:
        add:
          type: array
          items:
            type: string
        remove:
          type: array
          items:
            type: string
    TrackMember:
      allOf:
        - $ref: '#/components/schemas/PublicUser'
        - type: object
          required: [space_role, joined_at, added_by]
          properties:
            space_role:
              type: string
              nullable: true
              description: Their role in the Space; a person invited to a Track is a solver
            joined_at:
              type: string
              format: date-time
            added_by:
              $ref: '#/components/schemas/PublicUser'
    TrackProgress:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            type: object
            required: [user, role, is_track_member, solved]
            properties:
              user:
                $ref: '#/components/schemas/PublicUser'
              role:
                type: string
                nullable: true
              is_track_member:
                type: boolean
              solved:
                type: integer
    CreateTrackInviteRequest:
      type: object
      properties:
        username:
          type: string
          description: Address the invitation to one user. Omit for a link invitation.
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
