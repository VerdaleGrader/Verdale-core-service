      description: |
        `problem_ids` must list every problem of the Collection exactly once, otherwise 409 `ORDER_MISMATCH`.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/CollectionSlug'
      requestBody:
        required: true
        content:
