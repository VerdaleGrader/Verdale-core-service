openapi: 3.0.3
info:
  title: Verdale Core public API
  version: 0.10.0
  description: |
    Public HTTP API of Core service, consumed by the Frontend.
    Endpoints are added story by story: accounts and Spaces (M2), problems, tests,
    reference solutions, submissions, Tracks and Collections (M3). Everything except `/health` and `/ready` lives under `/api/v1`,
    the prefix the web app proxies to Core.

    Every error uses `ErrorResponse`. Every response carries an
    `X-Request-Id` header; when the request sends a UUID in `X-Request-Id`,
    Core reuses it.
servers:
  - url: http://localhost:8080
    description: Local Core
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      operationId: getReady
      summary: Readiness probe (database reachable)
      responses:
        '200':
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: A dependency is down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/auth/providers:
    get:
      operationId: listAuthProviders
      tags: [auth]
      summary: Sign-in methods that are enabled (for the login buttons)
      responses:
        '200':
          description: Enabled providers
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/OAuthProvider'
  /api/v1/auth/oauth/{provider}/start:
    get:
      operationId: startOAuth
      tags: [auth]
      summary: Begin sign-in with a provider
      description: |
        Navigate the browser here (not fetch). Core sets a short-lived signed
        cookie and redirects to the provider. Rate limited per client.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: redirect
          in: query
          description: Relative path to open after sign-in. Anything else is replaced by `/`.
          schema:
            type: string
            maxLength: 512
      responses:
        '302':
          description: Redirect to the provider
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/oauth/{provider}/callback:
    get:
      operationId: finishOAuth
      tags: [auth]
      summary: Provider redirect target (browser navigation)
      description: |
        Registered at the provider as `{FRONTEND_ORIGIN}/api/v1/auth/oauth/{provider}/callback`.
        On success sets the `vd_session` cookie (httpOnly, SameSite=Lax, Secure outside local,
        30 days) and redirects to the requested page. On any failure redirects to
        `{FRONTEND_ORIGIN}/login?error=<code>` where code is `access_denied`, `bad_request`
        or `not_found`. Never returns JSON.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the web app
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      description: Deletes the session on the server, so the cookie stops working even if kept.
      responses:
        '204':
          description: Logged out (also when there was no session)
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/me/ai-credentials:
    get:
      operationId: listAiCredentials
      tags: [users]
      summary: My saved AI provider keys (GRD-124)
      description: |
        Only the provider and the last four characters of each key; the key itself is never
        returned. `enabled` is false when the server has no encryption key set up, and the
        feature is then off.
      security:
        - session: []
      responses:
        '200':
          description: The keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiCredentialList'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/me/ai-credentials/{provider}:
    put:
      operationId: saveAiCredential
      tags: [users]
      summary: Save or replace my key for one AI provider (GRD-124)
      description: |
        The key is encrypted before it is stored and used only by Core, for the calls made on
        the author's behalf. Answers 503 when the feature is not set up on the server.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/AiProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAiCredentialRequest'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiCredential'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAiCredential
      tags: [users]
      summary: Remove my key for one AI provider (GRD-124)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/AiProvider'
      responses:
        '204':
          description: Removed (also when there was none)
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /api/v1/me:
    get:
      operationId: getMe
      tags: [users]
      summary: My account
      security:
        - session: []
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateMe
      tags: [users]
      summary: Change display name and/or username
      description: |
        Changing the username also renames the personal Space's slug in the same step.
        Usernames and Space slugs share one namespace.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/me/legal-acceptance:
    post:
      operationId: acceptLegal
      tags: [users]
      summary: Accept the Terms and the Privacy Policy
      description: |
        Records that the signed-in user accepted the versions of the Terms and the Privacy Policy that the page showed (GRD-122).
        Only the user, the document, its version and the time are stored. Idempotent.
        `409 LEGAL_VERSION_CHANGED` when a version is no longer current (the page was open while the documents were
        republished): reload, read, and accept again.
        Until a signed-in user has accepted the current versions, every other call that carries their session answers
        `403 LEGAL_ACCEPTANCE_REQUIRED`; only `GET /api/v1/me`, this call and `/api/v1/auth/*` (log out) stay open.
        A user who signs in for the first time has both documents recorded as part of creating the account.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalAcceptanceRequest'
      responses:
        '200':
          description: The account, with the acceptance now recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/users/{username}:
    get:
      operationId: getUser
      tags: [users]
      summary: Public profile (username and display name only)
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/me/spaces:
    get:
      operationId: listMySpaces
      tags: [spaces]
      summary: Spaces I belong to, with my role
      description: Personal Space first, then by name. Archived Spaces are listed separately with `archived=true`.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Query'
        - name: archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A page of Spaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpacePage'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/me/invites:
    get:
      operationId: listMyInvites
      tags: [invites]
      summary: Pending invitations addressed to me
      security:
        - session: []
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteList'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/me/invites/{inviteId}/accept:
    post:
      operationId: acceptMyInvite
      tags: [invites]
      summary: Accept an invitation addressed to me
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '200':
          description: Joined the Space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteOutcome'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/me/invites/{inviteId}/decline:
    post:
      operationId: declineMyInvite
      tags: [invites]
      summary: Decline an invitation addressed to me
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteOutcome'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/spaces:
    get:
      operationId: listPublicSpaces
      tags: [spaces]
      summary: Browse and search public, active Spaces
      description: Private Spaces never appear, whoever asks and whatever the query. No login needed.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Query'
      responses:
        '200':
          description: A page of Spaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpacePage'
        '400':
          $ref: '#/components/responses/Error'
    post:
      operationId: createSpace
      tags: [spaces]
      summary: Create a Space (the caller becomes its owner)
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpaceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}:
    get:
      operationId: getSpace
      tags: [spaces]
      summary: Read a Space
      description: |
        Public Spaces are readable without logging in. A private Space answers 404 to
        everyone who is not a member, exactly like a Space that does not exist.
        `member_count` is present for members only.
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: The Space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateSpace
      tags: [spaces]
      summary: Edit name, description or visibility (owner or administrator; only the owner can change visibility; the slug never changes)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpaceRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/archive:
    post:
      operationId: archiveSpace
      tags: [spaces]
      summary: Archive a Space (owner only)
      description: |
        Problems stay readable but nothing can be created, edited, published or submitted,
        and settings and members are frozen. A personal Space cannot be archived (409).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: Members of a Space (members only)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Members, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/members/{username}:
    patch:
      operationId: changeMemberRole
      tags: [members]
      summary: Change a member's role (owner or administrator)
      description: |
        The owner can set any role. An administrator can only move editors, observers and
        solvers between those three roles (403 otherwise). Sending `owner` hands the Space
        over (owner only): the previous owner becomes an administrator. The owner cannot be
        demoted directly (409).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Username'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeMember
      tags: [members]
      summary: Remove a member (owner or administrator)
      description: The owner cannot be removed (409); an administrator can only remove editors, observers and solvers.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Username'
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/leave:
    post:
      operationId: leaveSpace
      tags: [members]
      summary: Leave a Space
      description: >-
        The owner cannot leave (409); hand the Space over first. Allowed in an archived Space.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '204':
          description: Left
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/invites:
    get:
      operationId: listSpaceInvites
      tags: [invites]
      summary: Pending, unexpired invitations of a Space (owner or administrator)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteList'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: createInvite
      tags: [invites]
      summary: Invite by link, or by username (owner or administrator)
      description: |
        Without `username` the result carries a `link` that anyone logged in can use once.
        With `username` only that user can answer it. The `token` is returned once and only
        its hash is stored. Invitations never grant `owner`.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/invites/{inviteId}:
    delete:
      operationId: revokeInvite
      tags: [invites]
      summary: Revoke a pending invitation (owner or administrator)
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/InviteId'
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/invites/{token}:
    get:
      operationId: previewInvite
      tags: [invites]
      summary: What the holder of an invitation link sees (no login needed)
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: The invitation, with `status` pending, accepted, declined, revoked or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invite'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/invites/{token}/accept:
    post:
      operationId: acceptInvite
      tags: [invites]
      summary: Accept an invitation by its link token
      description: |
        410 when it is expired, revoked, already used, or its Space is archived.
        409 when you are already a member (the invitation is not used up).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: Joined the Space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteOutcome'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/invites/{token}/decline:
    post:
      operationId: declineInvite
      tags: [invites]
      summary: Decline an invitation by its link token
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/InviteToken'
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteOutcome'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
  /api/v1/problem-constraints:
    get:
      operationId: getProblemConstraints
      tags: [problems]
      summary: The ranges a problem must respect
      description: |
        The same object the editor view carries as `constraints`, available before a problem exists
        (the create page needs it). Public: it holds product limits only.
      responses:
        '200':
          description: The limits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemConstraints'
  /api/v1/spaces/{slug}/problems:
    get:
      operationId: listProblems
      tags: [problems]
      summary: Problems of a Space
      description: |
        Visitors and solvers only ever see `published` problems, whatever `status` says.
        Owners, administrators, editors and observers can also list `draft` and `archived` problems, or `all`
        (default `published`); `mine=true` keeps the ones they created.
        A private Space answers 404 to everyone who is not a member.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          description: Case-insensitive search in the title and the slug
          schema:
            type: string
            maxLength: 80
        - name: status
          in: query
          description: Staff only (owner, administrator, editor, observer); ignored for everyone else
          schema:
            type: string
            enum: [published, draft, archived, all]
            default: published
        - name: mine
          in: query
          description: Staff only; only problems I created
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: A page of problems, newest change first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemPage'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: createProblem
      tags: [problems]
      summary: Start a draft problem (owner, administrator or editor)
      description: |
        Creates the problem with an empty draft (version 1). Fill it with `PATCH`.
        Not allowed in an archived Space.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProblemRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}:
    get:
      operationId: getProblem
      tags: [problems]
      summary: A problem as the solver sees it
      description: |
        The statement, limits, allowed languages and the sample tests, nothing else:
        hidden tests, reference solutions and internal data are never sent here.
        A draft problem answers 404 unless the caller is staff of the Space (owner, administrator, editor or observer),
        who then sees exactly what solvers will see (a preview). Archived problems stay
        readable but report `accepts_submissions: false`.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '200':
          description: The problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateProblem
      tags: [problems]
      summary: Edit the draft (owner, administrator or editor)
      description: |
        Changes title, statement, limits or allowed languages of the draft version.
        A published version never changes: 409 `VERSION_PUBLISHED`.
        Limits outside the ranges in `constraints` are refused with a `details` entry per field.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProblemRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteProblem
      tags: [problems]
      summary: Delete a draft problem (owner, administrator or editor)
      description: A problem that has been published cannot be deleted; archive it instead (409).
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/editor:
    get:
      operationId: getProblemEditor
      tags: [problems]
      summary: Everything the editor needs (owner, administrator, editor or observer)
      description: |
        The draft (or, when there is none, the current version), the numbers behind
        the test and solution lists, the publish checklist and the allowed ranges.
        Readable in an archived Space; `editable` says whether it can be changed.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '200':
          description: The editor view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/publish:
    post:
      operationId: publishProblem
      tags: [problems]
      summary: Publish the draft (owner, administrator or editor)
      description: |
        Makes the draft the published, immutable version. Needs a statement, at least
        one sample test, one test in total with an expected output for every test, one allowed
        language and a primary reference solution; otherwise 409 `PUBLISH_BLOCKED` with one `details` entry per missing item.
        The version must be `verified` (a passing verification run whose content hash still matches the
        current tests, reference solutions, limits and languages) and also pass the publish rules; otherwise
        409 `PUBLISH_BLOCKED` with one `details` entry per failing check. Publishing the first version gives v1.0; publishing a
        Major draft makes it the open version (`major` + 1, `minor` 0). Both are immutable in their Major fields afterwards
        (see `constraints.version_fields`): a direct change to them is refused at the API and by a database trigger.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/verify:
    post:
      operationId: verifyProblem
      tags: [problems]
      summary: Run the reference solution against every test on Judge (owner, administrator or editor)
      description: |
        Moves the draft version from `draft` to `verifying` and sends one `verify` job (the primary
        reference solution and every test, hidden ones included) to Judge. The answer is 202 with the run;
        poll `GET .../verify` (about every 2 seconds) for progress. Every test must be AC for the run to pass;
        a pass moves the version to `verified`, a failure or an error moves it back to `draft` with the reason in
        the report. A run that Judge never answers is closed as `error` after a deadline, so the status never sticks.
        Needs the cheap checks (statement, languages, tests, outputs, samples, solution) to be ok first:
        otherwise 409 `VERIFY_BLOCKED` with one `details` entry per missing item. 409 `VERIFY_IN_PROGRESS` while a run is
        open; 409 `NO_DRAFT` when the problem has no draft version to verify.
        Editing the tests, the reference solutions, the limits or the languages of a `verified` version moves it back to `draft`
        and the old report is no longer `valid`.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '202':
          description: Verification started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRun'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    get:
      operationId: getVerification
      tags: [problems]
      summary: The latest verification run of the draft (owner, administrator, editor or observer)
      description: |
        The newest run for the current draft version, or 404 `NO_VERIFICATION` if none was started. Per-test
        results (which test failed and its verdict) are only for staff; solvers never reach this endpoint.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '200':
          description: The latest run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRun'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/updates:
    post:
      operationId: updatePublishedProblem
      tags: [problems]
      summary: Edit a published problem as a Minor or Major update (owner, administrator or editor)
      description: |
        Core decides the type from the fields that really change compared with the open version; the client never
        picks it (`constraints.version_fields` lists both groups). If no field of the Major group changes and
        `force_major` is false it is a **Minor update**: applied directly to the open version, effective at once, no draft and no
        verification, `minor` + 1, one history entry (who, when, field, old and new value). If any Major field changes, even
        one, or `force_major` is true, the whole update is **Major**: a draft of the next Major
        (`major + 1`, `minor` 0) is created from the open version (tests, reference solutions and everything else copied), the
        submitted fields are applied to it, and it must pass verification and the publish rules before it replaces the open
        version. While the draft exists solvers keep using the open version. `force_major` is not remembered. The slug cannot change.
        Minor fields keep the basic rules (non-empty statement, PDF size and page rules); a request that fails them changes nothing.
        `expected_version` is the version the client started from; if the open version moved on, 409 `VERSION_CONFLICT`
        with the current `label` in `details` and nothing is changed. A Minor update while a Major draft is open also copies each
        changed Minor field into the draft, but only the fields the draft has not changed itself.
        Test cases and reference solutions are changed with `POST .../draft` followed by the existing test and solution endpoints
        (any such change is Major by nature). 409 `DRAFT_EXISTS` when a Major draft is already open and the request is Major.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishedUpdateRequest'
      responses:
        '200':
          description: Applied (Minor) or draft created (Major)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOutcome'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/draft:
    post:
      operationId: createMajorDraft
      tags: [problems]
      summary: Start a draft of the next Major version (owner, administrator or editor)
      description: |
        Copies the open published version (everything, including tests and reference solutions) into a new draft
        `major + 1`, `minor` 0, so tests and solutions can be edited with the existing endpoints. Always a Major update;
        `force_major` is implied. 409 `DRAFT_EXISTS` if one is open, 409 `NOT_PUBLISHED` for a problem that was never published.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: discardMajorDraft
      tags: [problems]
      summary: Throw away the open Major draft (owner, administrator or editor)
      description: |
        Deletes the draft of a problem that has a published version. The open version is untouched. 409 `NO_DRAFT` if there
        is none; 409 `VERIFY_IN_PROGRESS` while a verification run is open.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      responses:
        '200':
          description: Discarded; the editor of the open version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemEditor'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/history:
    get:
      operationId: listProblemHistory
      tags: [problems]
      summary: Version and state history (owner, administrator, editor or observer)
      description: |
        Newest first. Minor and Major updates (who, when, which fields, old and new value, forced or not) and every state
        change (draft, verifying, verified, published) with who and when. Solvers and visitors get 403/404.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of history entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionHistoryPage'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/problems/{problemSlug}/archive:
    post:
      operationId: archiveProblem
      tags: [problems]
      summary: Archive a published problem (owner, administrator or editor)
      description: It stays readable but no longer accepts submissions. A never-published draft is deleted instead (409).
      security:
