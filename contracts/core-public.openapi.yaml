  /api/v1/spaces/{slug}/problems/{problemSlug}/submissions:
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Submit code
      description: |
        Only for a published problem in a Space the caller can submit to: any logged-in user in a
        public Space, members only in a private one, never in an archived Space. The language must
        be one the problem allows and the source at most `constraints.source_max_bytes` bytes.
        Answers 202 with the submission in status `queued` straight away; follow it with the
        events stream or by polling. If Judge is unavailable the submission is kept and handed
        over later. Limited to 10 submissions per minute per user (429 `RATE_LIMITED`).
        `track` names the Track the solver is working in; it must reach the problem for this
        person (400 with `details` field `track` otherwise). Left out, the first Track that
        reaches the problem is used, and none when no Track does. Staff reach every active Track.
        The Track is shown to staff in the Space-wide submission lists.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionSummary'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
    get:
      operationId: listSubmissions
      tags: [submissions]
      summary: Submissions of a problem, newest first
      description: |
        `scope=mine` (default) lists the caller's own. `scope=all` lists everyone's and is for
        the staff only (owner, administrator, editor, observer; 403 for others).
        Every item carries `test_runs`, the verdicts of its tests in judging order as runs, so a
        progress bar can be drawn for each row without fetching the submissions one by one.
        With `scope=mine` the page also carries `best`, the caller's best submission of the
        problem whatever page is asked for: the most tests passed, and among equals the one sent
        first. A submission that is not finished, ended in a system error (ISE) or passed no test
        is never the best, so `best` is null until one passes a test. `best` also appears among
        `items` on its own page; Web shows it apart. The source of any of them comes from
        `GET /api/v1/submissions/{submissionId}`.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/ProblemSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, all]
            default: mine
      responses:
        '200':
          description: A page of submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/spaces/{slug}/submissions:
    get:
      operationId: listSpaceSubmissions
      tags: [submissions]
      summary: Every submission of a Space, filterable (owner, administrator, editor, observer)
      description: |
        The Space-wide list for staff (GRD-93). Solvers, visitors and non-members get 403 / 404
        as for any private part of the Space. `member` and `problem` are exact (case-insensitive)
        username and problem slug; `q` searches the username, display name, problem slug and title.
        `track` is a Track slug, or `none` for submissions made from no Track. `verdict` takes
        several codes separated by commas (`AC,WA`). `from` and `to` bound the submission time.
        An unknown Track is 404.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: member
          in: query
          description: Username of the author
          schema:
            type: string
            maxLength: 80
        - name: q
          in: query
          schema:
            type: string
            maxLength: 80
        - name: problem
          in: query
          description: Problem slug
          schema:
            type: string
            maxLength: 80
        - name: track
          in: query
          description: Track slug, or `none`
          schema:
            type: string
            maxLength: 80
        - name: verdict
          in: query
          description: Comma-separated verdict codes, e.g. `AC,WA`
          schema:
            type: string
            example: AC,WA
        - name: language
          in: query
          schema:
            $ref: '#/components/schemas/Language'
        - name: version
          in: query
          description: Problem version number
          schema:
            type: integer
            minimum: 1
            maximum: 100000
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, member, tests_passed, time]
            default: newest
      responses:
        '200':
          description: A page of submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceSubmissionPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
